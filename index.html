<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FAF3F3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>WheatSpace - 英语学习乐园</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="social-login.css">
    <script src="config.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script>if (!window.React) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"><\/script>');</script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>if (!window.ReactDOM) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"><\/script>');</script>
    <script src="babel.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 已移除 Supabase JS SDK -->
    <!-- WheatSpace 认证工具 -->
    <script src="auth.js"></script>
    <!-- TDesign React -->
    <script src="https://cdn.jsdelivr.net/npm/tdesign-react@1.12.0/dist/tdesign-react.js"></script>
    <!-- TDesign Icons -->
    <script src="https://cdn.jsdelivr.net/npm/tdesign-icons-react@0.5.0/dist/tdesign-icons-react.js"></script>
    <!-- MediaPipe Pose for gesture detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        quest: {
                            // 布达佩斯大饭店正确配色
                            orange:   '#5C7995',   // 钢蓝（强调/主操作色）
                            teal:     '#AAABB9',   // 蓝灰（辅助色）
                            coral:    '#D49DAA',   // 玫瑰粉（次强调）
                            purple:   '#745B72',   // 深紫粉（主深色）
                            mint:     '#F5EEEE',   // 极浅粉（卡片背景）
                            lavender: '#F5EEEE',   // 极浅粉
                            green:    '#AAABB9',   // 蓝灰
                            yellow:   '#E6BCBC',   // 浅粉
                            dark:     '#3D2E3D',   // 深紫棕
                            muted:    '#9B8FA0',   // 紫灰
                            rose:     '#D49DAA',   // 玫瑰粉
                            cream:    '#FAF3F3',   // 奶粉白
                            blush:    '#E6BCBC',   // 浅粉
                        }
                    },
                    fontFamily: {
                        sans: ['PingFang SC', 'Microsoft YaHei', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
                    },
                    borderRadius: {
                        '2xl': '1rem',
                        '3xl': '1.5rem',
                        '4xl': '2rem',
                    },
                    boxShadow: {
                        'card': '0 8px 32px -4px rgba(116,91,114,0.12)',
                        'hover': '0 16px 40px -8px rgba(92,121,149,0.28)',
                        'glow-orange': '0 0 20px 4px rgba(92,121,149,0.35)',
                        'glow-green':  '0 0 20px 4px rgba(170,171,185,0.35)',
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            background: linear-gradient(160deg, #FAF3F3 0%, #F0E8F0 45%, #EAE8F0 100%);
            min-height: 100vh;
            min-height: 100dvh;
            overscroll-behavior: none;
            /* Hide content until curtain is opened */
            overflow: hidden;
        }

        #root {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-out;
        }

        body.learning #root {
            opacity: 1;
            pointer-events: auto;
        }
        
        /* iOS 安全区 */
        body.learning {
            overflow: auto;
        }

        /* Main Content 初始样式 */
        #main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 2.5s ease-out, transform 2.5s ease-out;
            z-index: 1;
            color: #4A4A4A;
        }

        #main-content h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 5.5rem;
            font-weight: 600;
            letter-spacing: 8px;
            margin-bottom: 10px;
            color: #111111;
            text-align: center;
        }

        #main-content p {
            font-size: 1.2rem;
            font-weight: 300;
            color: #8C8C8A;
            letter-spacing: 1px;
        }

        .start-hint {
            margin-top: 50px;
            font-size: 1.1rem;
            color: #8C8C8A;
            letter-spacing: 4px;
            animation: breathe 3s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes breathe {
            0% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-5px); }
            100% { opacity: 0.4; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            #main-content h1 { font-size: 3.5rem; letter-spacing: 4px; }
            #main-content p { font-size: 1rem; }
            .start-hint { font-size: 0.9rem; }
        }

        @media (max-width: 480px) {
            #main-content h1 { font-size: 2.8rem; letter-spacing: 2px; }
            #main-content p { font-size: 0.9rem; }
        }

        body.opened #main-content {
            opacity: 1;
            transform: scale(1);
            z-index: 20;
        }

        body.learning #main-content {
            opacity: 0 !important;
            pointer-events: none;
            z-index: -1 !important;
        }

        body { padding-bottom: env(safe-area-inset-bottom); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E6BCBC; border-radius: 2px; }

        /* 输入框 iOS 防缩放：font-size >= 16px */
        input, select, textarea { font-size: 16px !important; }

        /* 弹跳动画 */
        @keyframes bounceIn {
            0%   { transform: scale(0.3) translateY(20px); opacity: 0; }
            50%  { transform: scale(1.08) translateY(-4px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @keyframes bounceInSmall {
            0%   { transform: scale(0.6); opacity: 0; }
            60%  { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .bounce-in { animation: bounceIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards; }
        .bounce-in-sm { animation: bounceInSmall 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards; }

        /* 翻牌动画 */
        .flip-card { perspective: 600px; cursor: pointer; }
        .flip-card-inner { transition: transform 0.45s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; position: relative; }
        .flip-card-inner.flipped { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; position: absolute; inset: 0; border-radius: 1rem; display: flex; align-items: center; justify-content: center; }
        .flip-card-back { transform: rotateY(180deg); }

        /* 卡片高亮 */
        @keyframes matchGlow {
            0%   { box-shadow: 0 0 0 0 rgba(170,171,185,0.7); }
            50%  { box-shadow: 0 0 0 12px rgba(170,171,185,0); }
            100% { box-shadow: 0 0 0 0 rgba(170,171,185,0); }
        }
        .match-glow { animation: matchGlow 0.6s ease-out forwards; }

        /* 错误抖动 */
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%  { transform: translateX(-6px); }
            40%  { transform: translateX(6px); }
            60%  { transform: translateX(-4px); }
            80%  { transform: translateX(4px); }
        }
        .shake { animation: shake 0.4s ease-in-out forwards; }

        /* 正确弹跳 */
        @keyframes correctBounce {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.12); }
            70%  { transform: scale(0.96); }
            100% { transform: scale(1); }
        }
        .correct-bounce { animation: correctBounce 0.4s ease-in-out forwards; }

        /* 星星弹入 */
        @keyframes starPop {
            0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
            60%  { transform: scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        .star-pop { animation: starPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }

        /* 粒子爆炸 */
        @keyframes particleFly {
            0%   { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
        .particle { animation: particleFly 1.2s ease-out forwards; position: fixed; pointer-events: none; border-radius: 50%; }

        /* 火焰跳动 */
        @keyframes flameDance {
            0%,100% { transform: scale(1) rotate(-3deg); }
            50%     { transform: scale(1.15) rotate(3deg); }
        }
        .flame { animation: flameDance 0.8s ease-in-out infinite; display: inline-block; }

        /* XP 进度条动画 */
        @keyframes xpFill {
            from { width: var(--from-w); }
            to   { width: var(--to-w); }
        }
        .xp-bar { transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }

        /* Tab 切换滑入 */
        @keyframes slideUp {
            from { transform: translateY(24px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        .slide-up { animation: slideUp 0.35s cubic-bezier(0.4,0,0.2,1) forwards; }

        /* 卡片悬浮（桌面端） */
        .word-card {
            transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
        }
        @media (hover: hover) {
            .word-card:hover {
                transform: translateY(-6px) scale(1.02);
                box-shadow: 0 16px 40px -8px rgba(92,121,149,0.28);
            }
        }
        /* 移动端触摸反馈 */
        .word-card:active { transform: scale(0.97); }

        /* 按钮交互 */
        button { cursor: pointer; touch-action: manipulation; }
        button:active { transform: scale(0.95); }
        /* 移动端扩大点击区域 */
        @media (max-width: 640px) {
            button { min-height: 36px; }
        }

        /* 渐变文字 */
        .text-gradient {
            background: linear-gradient(135deg, #745B72, #5C7995);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .text-gradient-teal {
            background: linear-gradient(135deg, #AAABB9, #745B72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 背景卡片渐变 */
        .card-purple-grad { background: linear-gradient(135deg, #745B72 0%, #8A6888 100%); }
        .card-orange-grad { background: linear-gradient(135deg, #5C7995 0%, #D49DAA 100%); }
        .card-teal-grad   { background: linear-gradient(135deg, #AAABB9 0%, #8A9BB5 100%); }

        /* 选项按钮 */
        .option-btn {
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
            border: 2px solid transparent;
            touch-action: manipulation;
        }
        @media (hover: hover) {
            .option-btn:hover:not(:disabled) {
                transform: translateY(-2px);
                border-color: #5C7995;
                box-shadow: 0 4px 16px rgba(92,121,149,0.25);
            }
        }
        .option-btn:active:not(:disabled) { transform: scale(0.96); }
        .option-btn.correct { background: #AAABB9 !important; color: #fff !important; border-color: #AAABB9 !important; }
        .option-btn.wrong   { background: #D49DAA !important; color: #fff !important; border-color: #D49DAA !important; }
        .option-btn.reveal  { background: #E6BCBC !important; color: #3D2E3D !important; border-color: #E6BCBC !important; }

        /* 徽章 */
        .badge-locked { filter: grayscale(1) opacity(0.4); }
        .badge-unlocked { filter: none; }

        /* 进度点 */
        .quiz-dot { transition: all 0.3s ease; }
        .quiz-dot.done { background: #AAABB9; transform: scale(1.2); }
        .quiz-dot.current { background: #5C7995; transform: scale(1.3); box-shadow: 0 0 8px rgba(92,121,149,0.6); }
        .quiz-dot.pending { background: rgba(255,255,255,0.3); }

        /* 加载页 */
        @keyframes spin360 {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        .spin { animation: spin360 1s linear infinite; }

        /* ---- 移动端底部导航安全区 ---- */
        .bottom-nav-safe {
            padding-bottom: max(8px, env(safe-area-inset-bottom));
        }

        /* ---- 弹窗滚动锁定 ---- */
        body.modal-open { overflow: hidden; position: fixed; width: 100%; }

        /* ---- Header 移动端两行布局 ---- */
        .header-row2 { display: none; }
        @media (max-width: 520px) {
            .header-row1-right { display: none; }
            .header-row2 { display: flex; }
        }

        /* ---- 移动端主内容顶部间距（两行 Header） ---- */
        @media (max-width: 520px) {
            .main-content { padding-top: 7rem !important; }
        }

        /* ---- 小屏词汇卡片单列 ---- */
        @media (max-width: 360px) {
            .word-grid { grid-template-columns: repeat(1, minmax(0, 1fr)) !important; }
        }

        /* ---- 翻牌游戏小屏 4 列→3 列 ---- */
        @media (max-width: 380px) {
            .flip-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
        }

        /* ---- 日历样式 ---- */
        .cal-day {
            aspect-ratio: 1;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
            min-width: 0;
        }
        .cal-day:active { transform: scale(0.93); }
        @media (hover: hover) { .cal-day:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(255,159,28,0.25); } }
        .cal-day.today { outline: 2.5px solid #5C7995; }
        .cal-day.has-data { background: linear-gradient(135deg, #F5EEEE, #EDE8F0); }
        .cal-day.checked { background: linear-gradient(135deg, #745B72, #5C7995) !important; color: #fff; }
        .cal-day.checked .cal-day-num { color: #fff; }
        .cal-day.future { opacity: 0.35; cursor: default; }
        .cal-day-num { font-size: 13px; font-weight: 700; line-height: 1; }
        .cal-day-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 2px; }
        .cal-day-xp { font-size: 9px; font-weight: 700; margin-top: 1px; line-height: 1; }

        /* 日历详情弹窗 */
        .day-detail-modal {
            animation: slideUpModal 0.28s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }
        @keyframes slideUpModal {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        /* ---- 弹窗在小屏底部弹出 ---- */
        @media (max-width: 520px) {
            .modal-panel {
                position: fixed !important;
                bottom: 0 !important;
                left: 0 !important;
                right: 0 !important;
                top: auto !important;
                transform: none !important;
                border-bottom-left-radius: 0 !important;
                border-bottom-right-radius: 0 !important;
                border-top-left-radius: 1.5rem !important;
                border-top-right-radius: 1.5rem !important;
                max-width: 100% !important;
                padding-bottom: max(24px, env(safe-area-inset-bottom)) !important;
            }
        }

        /* ---- 单词详情页（全屏页面滑入） ---- */
        @keyframes detailPageSlideIn {
            from { transform: translateX(100%); opacity: 0.6; }
            to   { transform: translateX(0); opacity: 1; }
        }
        .word-detail-page {
            animation: detailPageSlideIn 0.32s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
        }
        .phonetic-badge {
            background: linear-gradient(135deg, #745B72, #8A6888);
            color: #FAF3F3;
            font-family: 'Times New Roman', serif;
            letter-spacing: 0.05em;
        }
        .detail-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #9B8FA0;
        }
        .related-chip {
            background: #F5EEEE;
            color: #745B72;
            border: 1px solid #E6BCBC;
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .related-chip:hover { background: #745B72; color: #FAF3F3; }

        /* ---- 虚拟宠物（泰迪狗）动画 ---- */
        @keyframes dogIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        @keyframes dogJump {
            0% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-25px) scale(1.1); }
            50% { transform: translateY(-30px) scale(1.05); }
            70% { transform: translateY(-20px) scale(1.08); }
            100% { transform: translateY(0) scale(1); }
        }
        @keyframes dogWagTail {
            0%, 100% { transform: rotate(-15deg); }
            50% { transform: rotate(25deg); }
        }
        @keyframes dogBark {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15) rotate(-5deg); }
            50% { transform: scale(1.1) rotate(5deg); }
            75% { transform: scale(1.12) rotate(-3deg); }
        }
        @keyframes dogWave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-20deg); }
            75% { transform: rotate(20deg); }
        }
        @keyframes speechBubble {
            0% { transform: scale(0) translateY(10px); opacity: 0; }
            20% { transform: scale(1.1) translateY(-5px); opacity: 1; }
            40% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 0; }
        }
        .dog-idle { animation: dogIdle 2.5s ease-in-out infinite; }
        .dog-jump { animation: dogJump 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards; }
        .dog-wag { animation: dogWagTail 0.3s ease-in-out infinite; }
        .dog-bark { animation: dogBark 0.5s ease-in-out 2; }
        .speech-bubble { animation: speechBubble 4s ease-out forwards; }

        /* ---- 番茄时钟样式 ---- */
        .pomodoro-timer {
            position: fixed;
            bottom: 90px;
            right: 16px;
            z-index: 40;
            background: linear-gradient(135deg, #745B72, #5C7995);
            border-radius: 20px;
            padding: 8px 14px;
            color: #FAF3F3;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 4px 20px rgba(116,91,114,0.35);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .pomodoro-timer:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(116,91,114,0.45); }
        .pomodoro-timer.break-time {
            background: linear-gradient(135deg, #D49DAA, #E6BCBC);
            animation: pulse 1s ease-in-out infinite;
        }
        .pomodoro-timer.paused {
            background: linear-gradient(135deg, #5C7995, #3A506B);
            animation: pulsePaused 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes pulsePaused {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
<div id="root"></div>

<div id="main-content">
    <h1>WheatSpace</h1>
    <p>English Learning Paradise</p>
    <div class="start-hint">继续点击，开始学习</div>
</div>

<!-- Loading Curtain Animation -->
<div id="curtain-container">
    <canvas id="curtain-canvas"></canvas>
    <div id="instruction">
        <span class="icon">👆</span>
        拖动鼠标，掀开门帘
    </div>
</div>
<script src="script.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// =============================================
// 数据埋点：上报用户行为
// =============================================
const trackEvent = async (userId, action, data = {}, durationSeconds = 0) => {
    if (!userId) return;
    try {
        await window.WheatSpaceAuth.recordLearningAction(action, data, durationSeconds);
    } catch (e) {
        console.warn('trackEvent error:', e);
    }
};

// =============================================
// 数据层：词库、例句、成就
// =============================================
const WORD_BANKS = {
    primary1: [
        { en: 'apple',   zh: '苹果',   emoji: '🍎', sentence: 'I eat an apple every day.', tip: 'A开头，红色的水果' },

const speak = (text, lang = null, rate = 0.85) => {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    
    // 确定使用的语言/口音
    let useLang = lang;
    if (!useLang) {
        // 从localStorage读取偏好，如果没有则使用默认值
        try {
            const saved = localStorage.getItem('eq_accent');
            useLang = saved === 'uk' ? 'en-GB' : 'en-US';
        } catch {
            useLang = 'en-US';
        }
    }
    
    utter.lang = useLang;
    utter.rate = rate;
    utter.pitch = 1.1;
    window.speechSynthesis.speak(utter);
};

const playSound = (type) => {
    if (!window.AudioContext && !window.webkitAudioContext) return;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(type === 'correct' ? 800 : 300, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.3);
};

const getSpeechRecognition = () => {
    return window.SpeechRecognition || window.webkitSpeechRecognition || window.mozSpeechRecognition || window.msSpeechRecognition;
};

// 检查是否支持语音识别（需要HTTPS或localhost）
const checkSpeechSupport = () => {
    const SpeechRecognition = getSpeechRecognition();
    const isSecureContext = window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    
    if (!SpeechRecognition) {
        return { supported: false, reason: 'browser' }; // 浏览器不支持
    }
    if (!isSecureContext) {
        return { supported: false, reason: 'https' }; // 需要HTTPS
    }
    return { supported: true, reason: null };
};

const recognizePronunciation = (expectedText, onResult) => {
    const support = checkSpeechSupport();
    
    // 如果浏览器原生支持 SpeechRecognition，则优先使用
    if (support.supported && getSpeechRecognition()) {
        const SpeechRecognition = getSpeechRecognition();
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.continuous = false;
        
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.trim().toLowerCase();
            const expected = expectedText.toLowerCase();
            let score = 0;
            if (transcript === expected) {
                score = 100;
            } else {
                // 简单相似度计算
                const len = Math.max(transcript.length, expected.length);
                let matches = 0;
                for (let i = 0; i < Math.min(transcript.length, expected.length); i++) {
                    if (transcript[i] === expected[i]) matches++;
                }
                score = Math.round((matches / len) * 100);
            }
            onResult({ transcript, score, error: null });
        };
        
        recognition.onerror = (event) => {
            // 更详细的错误信息
            const errorMessages = {
                'not-allowed': '请允许麦克风权限后再试',
                'no-speech': '没有检测到语音，请对着麦克风说话',
                'network': '网络错误，请检查网络连接',
                'audio-capture': '无法访问麦克风，请检查设备',
                'aborted': '录音被中断',
                'service-not-allowed': '语音服务不可用'
            };
            onResult({ error: errorMessages[event.error] || `识别错误: ${event.error}`, score: 0 });
        };
        
        recognition.onend = () => {
            // 识别结束
        };
        
        try {
            recognition.start();
        } catch (e) {
            onResult({ error: '启动语音识别失败，请刷新页面重试', score: 0 });
        }
        return recognition;
    } 
    
    // 手机端或不支持的浏览器：回退使用 MediaRecorder + 后端 STT
    let mediaRecorder = null;
    let audioChunks = [];
    let stopped = false;
    
    const fallbackObj = {
        stop: () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                try { mediaRecorder.stop(); } catch(e) {}
                if (mediaRecorder.stream) {
                    mediaRecorder.stream.getTracks().forEach(t => t.stop());
                }
            }
            stopped = true;
        }
    };

    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            if (stopped) return;
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };
            mediaRecorder.onstop = async () => {
                if (stopped && audioChunks.length === 0) return;
                const audioBlob = new Blob(audioChunks);
                const formData = new FormData();
                formData.append('audio', audioBlob, 'audio.webm');
                
                try {
                    const res = await fetch(API_BASE + '/ai/stt', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    
                    if (data.success && data.text) {
                        const transcript = data.text.replace(/[.,!?。，！？]/g, '').trim().toLowerCase();
                        const expected = expectedText.toLowerCase();
                        let score = 0;
                        if (transcript === expected) {
                            score = 100;
                        } else {
                            const len = Math.max(transcript.length, expected.length);
                            let matches = 0;
                            for (let i = 0; i < Math.min(transcript.length, expected.length); i++) {
                                if (transcript[i] === expected[i]) matches++;
                            }
                            score = Math.round((matches / len) * 100);
                        }
                        onResult({ transcript, score, error: null });
                    } else {
                        onResult({ error: '未能听清，请重读', score: 0 });
                    }
                } catch (err) {
                    onResult({ error: '网络错误，无法连接语音服务', score: 0 });
                }
            };
            
            mediaRecorder.start();
            
            // 自动录音 2.5 秒后停止
            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    fallbackObj.stop();
                }
            }, 2500);
        })
        .catch(err => {
            onResult({ error: '请允许麦克风权限后再试', score: 0 });
        });
        
    return fallbackObj;
};

const shuffle = (arr) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
};

const calcLevel = (xp) => {
    let level = 1, needed = 0;
    while (xp >= needed + level * 50) { needed += level * 50; level++; }
    return { level, xpInLevel: xp - needed, xpNeeded: level * 50 };
};

const getTodayStr = () => new Date().toISOString().split('T')[0];

// 每日单词选择：根据日期生成固定的5个单词
const getDailyWords = (bankKey, dateStr = null) => {
    const today = dateStr || getTodayStr();
    const allWords = WORD_BANKS[bankKey];
    if (!allWords || allWords.length === 0) return [];
    
    // 使用日期作为种子生成稳定的随机选择
    const seed = today.split('-').reduce((a, b) => a + parseInt(b), 0);
    const wordCount = 6; // 每天显示6个单词
    
    // 简单的伪随机选择（同一天选择相同的单词）
    const selected = [];
    const used = new Set();
    for (let i = 0; i < wordCount && selected.length < wordCount; i++) {
        const idx = (seed * (i + 1) * 7 + i * 13) % allWords.length;
        if (!used.has(idx)) {
            used.add(idx);
            selected.push(allWords[idx]);
        }
    }
    return selected;
};

// 检查今日任务是否完成（学习20个单词 + 完成1次挑战）
const isDailyTaskComplete = (dailyLogs) => {
    const today = getTodayStr();
    const log = dailyLogs[today];
    const target = 20 + (log?.extraLimit || 0);
    return log && log.words >= target && log.answers >= 5;
};

const generateQuiz = (words) => {
    const pool = shuffle(words).slice(0, 5);
    const quizTypes = ['zh2en', 'emoji2en', 'en2zh'];
    return pool.map((word, i) => {
        const type = quizTypes[i % 3];
        const wrongPool = words.filter(w => w.en !== word.en);
        const wrongs = shuffle(wrongPool).slice(0, 3);
        let options, question, answer;
        if (type === 'zh2en') {
            question = word.zh;
            answer = word.en;
            options = shuffle([word.en, ...wrongs.map(w => w.en)]);
        } else if (type === 'emoji2en') {
            question = word.emoji;
            answer = word.en;
            options = shuffle([word.en, ...wrongs.map(w => w.en)]);
        } else {
            question = word.en;
            answer = word.zh;
            options = shuffle([word.zh, ...wrongs.map(w => w.zh)]);
        }
        return { type, question, answer, options, word };
    });
};

const LoginModal = ({ visible, onClose, onLoginSuccess }) => {
    const [mode, setMode] = useState('login'); // 'login' | 'register'
    const [phone, setPhone] = useState('');
    const [code, setCode] = useState('');
    const [nickname, setNickname] = useState('');
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');
    const [successMsg, setSuccessMsg] = useState('');
    const [socialLoading, setSocialLoading] = useState(null); // 'google' | 'github' | null
    const [countdown, setCountdown] = useState(0);

    const resetModal = () => {
        setPhone(''); setCode(''); setNickname('');
        setLoading(false); setError(''); setSuccessMsg('');
        setSocialLoading(null);
        setMode('login');
        setCountdown(0);
    };

    const handleClose = () => { resetModal(); onClose(); };

    // 弹窗时锁定 body 滚动
    useEffect(() => {
        if (visible) {
            document.body.classList.add('modal-open');
        } else {
            document.body.classList.remove('modal-open');
        }
        return () => document.body.classList.remove('modal-open');
    }, [visible]);

    // 验证码倒计时
    useEffect(() => {
        let timer;
        if (countdown > 0) {
            timer = setInterval(() => {
                setCountdown(prev => prev - 1);
            }, 1000);
        }
        return () => clearInterval(timer);
    }, [countdown]);

    // 发送验证码
    const handleSendCode = async () => {
        setError(''); setSuccessMsg('');
        if (!/^1[3-9]\d{9}$/.test(phone)) { setError('请输入正确的11位手机号'); return; }
        
        try {
            setCountdown(60);
            const { success, error: err } = await window.WheatSpaceAuth.sendSmsCode(phone);
            if (!success) throw new Error(err);
            setSuccessMsg('验证码已发送，请查收短信');
        } catch (err) {
            setCountdown(0);
            setError(err.message || '发送验证码失败');
        }
    };

    // 验证并登录/注册
    const handleSubmit = async () => {
        setError(''); setSuccessMsg('');
        if (!phone.trim() || !code.trim()) { setError('请填写手机号和验证码'); return; }
        if (!/^1[3-9]\d{9}$/.test(phone)) { setError('请输入正确的11位手机号'); return; }
        
        setLoading(true);
        try {
            const { success, user, token, error: err } = await window.WheatSpaceAuth.loginWithSms(phone, code);
            if (!success) throw new Error(err);
            
            // 如果是注册，尝试保存昵称等信息
            let finalNickname = `用户${phone.slice(-4)}`;
            if (mode === 'register' && nickname.trim()) {
                finalNickname = nickname.trim();
            }
                
            const displayName = user?.nickname || finalNickname;
            onLoginSuccess({ id: user.id, phone: phone, username: displayName });
            handleClose();
        } catch (e) {
            const msg = e.message || '';
            if (msg.includes('Token has expired or is invalid')) setError('验证码错误或已过期');
            else setError(msg || '操作失败，请稍后重试');
        } finally {
            setLoading(false);
        }
    };

    if (!visible) return null;

    return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm">
            <div className="modal-panel bg-white rounded-3xl p-6 w-full max-w-sm mx-0 sm:mx-4 shadow-2xl bounce-in-sm">
                <div className="flex justify-between items-center mb-5">
                    <div>
                        <h3 className="font-bold text-quest-dark text-lg">
                            {mode === 'login' ? '📱 登录账号' : '🌱 注册账号'}
                        </h3>
                        <p className="text-xs text-quest-muted mt-0.5">登录后数据云端同步，永不丢失</p>
                    </div>
                    <button onClick={handleClose} className="text-quest-muted hover:text-quest-coral text-2xl leading-none">×</button>
                </div>

                {/* 切换 Tab */}
                <div className="flex rounded-xl overflow-hidden border border-gray-200 mb-5">
                    {[['login','手机登录'],['register','手机注册']].map(([m, label]) => (
                        <button key={m} onClick={() => { setMode(m); setError(''); setSuccessMsg(''); }}
                            className={`flex-1 py-2 text-sm font-medium transition-all ${mode === m ? 'text-white' : 'text-quest-muted bg-gray-50 hover:bg-gray-100'}`}
                            style={mode === m ? { background: 'linear-gradient(135deg, #745B72, #5C7995)' } : {}}>
                            {label}
                        </button>
                    ))}
                </div>

                {/* 表单区块 */}
                <div className="space-y-3 mt-4">
                    <input
                        value={phone}
                        onChange={e => setPhone(e.target.value.replace(/\D/g, '').slice(0, 11))}
                        placeholder="11位手机号"
                        type="tel"
                        className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:border-quest-orange focus:outline-none"
                    />
                    {mode === 'register' && (
                        <input
                            value={nickname}
                            onChange={e => setNickname(e.target.value)}
                            placeholder="昵称（可选）"
                            type="text"
                            className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:border-quest-orange focus:outline-none"
                        />
                    )}
                    <div className="flex gap-2">
                        <input
                            value={code}
                            onChange={e => setCode(e.target.value.replace(/\D/g, '').slice(0, 6))}
                            placeholder="短信验证码"
                            type="text"
                            onKeyDown={e => e.key === 'Enter' && handleSubmit()}
                            className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:border-quest-orange focus:outline-none"
                        />
                        <button 
                            onClick={handleSendCode}
                            disabled={countdown > 0 || !/^1[3-9]\d{9}$/.test(phone)}
                            className="whitespace-nowrap px-4 py-2.5 rounded-xl text-sm font-medium transition-all text-white disabled:opacity-50"
                            style={{ background: 'linear-gradient(135deg, #F09A59, #EDAEBB)' }}
                        >
                            {countdown > 0 ? `${countdown}s后重试` : '获取验证码'}
                        </button>
                    </div>
                    {error && <p className="text-xs text-quest-coral">{error}</p>}
                    {successMsg && <p className="text-xs text-quest-teal font-medium">{successMsg}</p>}
                    {!successMsg && (
                        <button
                            onClick={handleSubmit}
                            disabled={loading}
                            className="w-full py-3 rounded-xl text-white font-bold text-sm hover:opacity-90 transition-all disabled:opacity-50"
                            style={{ background: 'linear-gradient(135deg, #745B72, #5C7995)' }}
                        >
                            {loading ? '处理中...' : mode === 'login' ? '登录' : '注册'}
                        </button>
                    )}
                </div>

                <p className="text-center text-xs text-quest-muted mt-4">
                    {mode === 'login' ? '还没有账号？' : '已有账号？'}
                    <button onClick={() => { setMode(mode === 'login' ? 'register' : 'login'); setError(''); setSuccessMsg(''); }}
                        className="text-quest-orange font-medium ml-1 hover:underline">
                        {mode === 'login' ? '立即注册' : '去登录'}
                    </button>
                </p>
            </div>
        </div>
    );
};

    // 从vocabulary.json获取形近词、近义词
    useEffect(() => {
        if (!word) return;
        setLoadingExtra(true);
        fetch('./vocabulary.json')
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(all => {
                const en = word.en.toLowerCase();
                const similar = all.filter(w => {
                    if (w.word === en) return false;
                    const s = w.word.toLowerCase();
                    return (s[0] === en[0] && Math.abs(s.length - en.length) <= 2) ||
                           (s.slice(0,2) === en.slice(0,2) && s !== en);
                }).slice(0, 5);
                const syns = all.filter(w => {
                    if (w.word === en) return false;
                    return w.grade === (word.grade || '') || w.emoji === word.emoji;
                }).slice(0, 5);
                setExtraData({ similar, synonyms: syns });
            })
            .catch(() => setExtraData({ similar: [], synonyms: [] }))
            .finally(() => setLoadingExtra(false));
    }, [word?.en]);

    if (!word) return null;

    const handleSpeak = () => {
        setSpeaking(true);
        speak(word.en);
        onLearn && onLearn(word.en);
        setTimeout(() => setSpeaking(false), 1400);
    };

    return (
        <div className="word-detail-page fixed inset-0 z-50 overflow-y-auto"

                    style={{background:'#F5EEEE', color:'#745B72'}}>
                    ← 返回
                </button>
                <span className="text-base font-bold truncate" style={{color:'#3D2E3D'}}>{word.en}</span>
            </div>

            {/* 顶部彩色装饰条 */}
            <div className="h-1" style={{background:'linear-gradient(90deg,#745B72,#AAABB9,#5C7995)'}} />

            <div className="max-w-2xl mx-auto px-4 py-6 pb-16">
                {/* Emoji + 单词 + 音标 + 发音按钮 */}

                    <div className="text-7xl leading-none">{word.emoji || '📖'}</div>

                        {word.phonetic && (
                            <span className="inline-block mt-2 px-3 py-1 rounded-full text-sm phonetic-badge">/{word.phonetic}/</span>
                        )}
                        <div className="mt-3">
                            <button onClick={handleSpeak}
                                className="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-all"
                                style={speaking ? {background:'#5C7995',color:'#fff'} : {background:'#fff',color:'#745B72',border:'1.5px solid #E6BCBC'}}>
                                {speaking ? '🔊 朗读中…' : '🔊 听发音'}

                    <div className="text-center">
                        <button onClick={(e) => {
                            if (rubricState.status === 'recording') {
                                if (recognitionRef.current) { try { recognitionRef.current.stop(); } catch(err) {} }
                                setRubricState({ status: 'idle', result: null });
                                return;
                            }
                            setRubricState({ status: 'recording', result: null });
                            // 先朗读一遍示范，或者直接开始录音？要求直接录音
                            const targetText = word.sentence || word.en;
                            const rec = recognizePronunciation(targetText, (result) => {
                                if (result.error) {
                                    setRubricState({ status: 'error', result: result.error });
                                    setTimeout(() => setRubricState({ status: 'idle', result: null }), 3000);
                                } else {
                                    // 模拟各维度分数（基于总分微调）
                                    const base = result.score;
                                    const comp = Math.min(100, base + Math.floor(Math.random()*10)); // 完整性 (60%)
                                    const acc = base; // 准确性 (25%)
                                    const flu = Math.max(50, base - Math.floor(Math.random()*10)); // 流畅度 (15%)
                                    const finalScore = Math.round(comp * 0.6 + acc * 0.25 + flu * 0.15);
                                    
                                    setRubricState({ 
                                        status: 'done', 
                                        result: `【跟读诊断报告】\n综合得分：${finalScore}分\n\n🎯 完整性(60%)：${comp}分\n🎯 准确性(25%)：${acc}分\n🎯 流畅度(15%)：${flu}分\n\n您说的是：${result.transcript}` 
                                    });
                                }

                        }}

                {!loadingExtra && extraData && (
                    <>

                            <div className="mb-4 p-5 rounded-3xl shadow-card" style={{background:'#fff', border:'1px solid #E6BCBC'}}>
                                <p className="detail-section-title mb-3">形近词</p>

                                <p className="detail-section-title mb-3">同类词</p>

const WordCard = ({ word, onLearn, onOpenDetail, addXP, updatePlayer }) => {
    const [speaking, setSpeaking] = useState(false);
    const [listenMode, setListenMode] = useState(false); // 跟读模式
    const [scoreResult, setScoreResult] = useState(null); // { score, transcript }
    const recognitionRef = useRef(null);
    
    const handleSpeak = (e) => {
        e.stopPropagation();
        setSpeaking(true);
        speak(word.en);
        onLearn(word.en);
        setTimeout(() => setSpeaking(false), 1200);
    };

    const handleFollowRead = (e) => {
        e.stopPropagation();
        if (listenMode) {
            // 取消跟读
            if (recognitionRef.current) { try { recognitionRef.current.stop(); } catch(err) {} }
            setListenMode(false);
            setScoreResult(null);
            return;
        }
        setScoreResult(null);
        setListenMode(true);
        // 先朗读一遍示范
        speak(word.en);
        setTimeout(() => {
            const rec = recognizePronunciation(word.en, (result) => {
                setListenMode(false);
                if (result.error) {
                    setScoreResult({ score: -1, msg: result.error });
                } else {
                    setScoreResult({ score: result.score, transcript: result.transcript });
                    if (result.score >= 80 && addXP) addXP(1);
                    if (result.score >= 80 && updatePlayer) updatePlayer(prev => ({...prev, goodPronunciations: (prev.goodPronunciations||0)+1}));
                }
                setTimeout(() => setScoreResult(null), 3000);
            });
            recognitionRef.current = rec;
        }, 1200);
    };
    
    return (
        <div className="word-card bg-white rounded-3xl p-4 shadow-card flex flex-col items-center gap-1.5 relative cursor-pointer"
             onClick={() => onOpenDetail && onOpenDetail(word)}
             style={{border:'1.5px solid #F5EEEE'}}>
            {/* 右上角提示 */}
            <div className="absolute top-2.5 right-2.5 text-xs rounded-full px-1.5 py-0.5"
                 style={{background:'#F5EEEE', color:'#9B8FA0', fontSize:'10px'}}>详情 ›</div>
            <div className="text-5xl mb-0.5">{word.emoji}</div>
            <div className="text-xl font-bold" style={{color:'#3D2E3D'}}>{word.en}</div>
            {/* 发音 + 跟读按钮 */}
            <div className="flex gap-1.5 mt-0.5" onClick={e => e.stopPropagation()}>
                <button onClick={handleSpeak}
                    className={`flex items-center gap-1 px-2.5 py-1.5 rounded-full text-xs font-medium transition-all`}
                    style={speaking ? {background:'#5C7995', color:'#fff'} : {background:'#F5EEEE', color:'#745B72'}}>
                    {speaking ? '🔊…' : '🔊'}
                </button>
                <button onClick={handleFollowRead}
                    className="flex items-center gap-1 px-2.5 py-1.5 rounded-full text-xs font-medium transition-all"
                    style={listenMode ? {background:'#D49DAA', color:'#fff', animation:'pulse 1s infinite'} : {background:'#F5EEEE', color:'#745B72'}}>
                    {listenMode ? '🎤 听...' : '🎤 跟读'}
                </button>
            </div>
            {/* 跟读评分 */}
            {scoreResult && (
                <div className="w-full mt-1 px-2 py-1 rounded-xl text-center text-xs font-bold"
                     style={scoreResult.score >= 80 ? {background:'#AAABB9',color:'#fff'} : scoreResult.score >= 50 ? {background:'#E6BCBC',color:'#3D2E3D'} : {background:'#F5EEEE',color:'#9B8FA0'}}>
                    {scoreResult.score < 0 ? scoreResult.msg :
                     scoreResult.score >= 80 ? `🎉 ${scoreResult.score}分 棒极了！` :
                     scoreResult.score >= 50 ? `👍 ${scoreResult.score}分 继续加油` :
                     `💪 ${scoreResult.score}分 再试试`}
                </div>
            )}
        </div>
    );
};

const FlipGame = ({ words, onComplete, addXP }) => {
    const [cards, setCards] = useState([]);
    const [flipped, setFlipped] = useState([]);
    const [matched, setMatched] = useState([]);
    const [checking, setChecking] = useState(false);
    const [celebrate, setCelebrate] = useState(false);
    const [moves, setMoves] = useState(0);
    const timerRef = useRef(null);

    const initGame = useCallback(() => {
        const picked = shuffle(words).slice(0, 6);
        const deck = shuffle([
            ...picked.map((w, i) => ({ id: 'en' + i, pairId: i, type: 'en', content: w.en, word: w })),
            ...picked.map((w, i) => ({ id: 'zh' + i, pairId: i, type: 'zh', content: w.zh, word: w })),
        ]);
        setCards(deck);
        setFlipped([]);
        setMatched([]);
        setChecking(false);
        setMoves(0);
        setCelebrate(false);
    }, [words]);

    useEffect(() => { initGame(); }, [words]);
    useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

    const handleFlip = (card) => {
        if (checking || flipped.includes(card.id) || matched.includes(card.pairId)) return;
        if (flipped.length === 0) {
            setFlipped([card.id]);
            speak(card.type === 'en' ? card.content : card.word.en);
        } else if (flipped.length === 1) {
            const first = cards.find(c => c.id === flipped[0]);
            setFlipped([flipped[0], card.id]);
            setMoves(m => m + 1);
            if (first.pairId === card.pairId) {
                playSound('correct');
                setMatched(prev => {
                    const next = [...prev, card.pairId];
                    if (next.length === 6) {
                        setCelebrate(true);
                        addXP(20);
                        onComplete();
                    }
                    return next;
                });
                setFlipped([]);
            } else {
                playSound('wrong');
                setChecking(true);
                timerRef.current = setTimeout(() => { setFlipped([]); setChecking(false); }, 900);
            }
        }
    };

    return (
        <div className="mt-4">
            {celebrate && <CelebrationEffect onDone={() => setCelebrate(false)} />}
            <div className="flex justify-between items-center mb-4">
                <div className="flex items-center gap-2">
                    <span className="text-quest-orange font-bold">🎮 翻牌配对</span>
                    <span className="text-xs text-quest-muted">找出所有配对！</span>
                </div>
                <div className="flex items-center gap-3">
                    <span className="text-xs text-quest-muted">已翻 {moves} 次</span>
                    <button onClick={initGame} className="text-xs px-3 py-1.5 rounded-full bg-quest-lavender text-quest-purple font-medium hover:bg-quest-orange hover:text-white transition-all">🔄 重新开始</button>
                </div>
            </div>
            {celebrate && (
                <div className="bounce-in text-center py-6 mb-4 rounded-3xl bg-gradient-to-r from-quest-orange to-quest-coral text-white">
                    <div className="text-4xl mb-2">🎉</div>
                    <div className="font-bold text-lg">太厉害了！全部配对！</div>
                    <div className="text-sm opacity-90 mt-1">获得 +20 XP 奖励！</div>
                </div>
            )}
            <div className="flip-grid grid grid-cols-3 gap-2 sm:grid-cols-4 sm:gap-3">
                {cards.map(card => {
                    const isFlipped = flipped.includes(card.id) || matched.includes(card.pairId);
                    const isMatched = matched.includes(card.pairId);
                    return (
                        <div key={card.id} className="flip-card aspect-square" onClick={() => handleFlip(card)}>
                            <div className={`flip-card-inner w-full h-full ${isFlipped ? 'flipped' : ''}`} style={{ width: '100%', height: '100%' }}>
                                <div className="flip-card-front w-full h-full card-purple-grad rounded-2xl flex items-center justify-center shadow-card">
                                    <span className="text-3xl">❓</span>
                                </div>
                                <div className={`flip-card-back w-full h-full rounded-2xl flex items-center justify-center shadow-card text-center px-2 ${isMatched ? 'match-glow' : ''}`}
                                    style={{ background: isMatched ? 'linear-gradient(135deg, #AAABB9, #8A9BB5)' : 'linear-gradient(135deg, #FAF3F3, #F5EEEE)' }}>
                                    <span className={`font-bold text-sm break-all ${isMatched ? 'text-white' : 'text-quest-dark'}`}>{card.content}</span>
                                </div>
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
};

const vocabCache = {};

const useCurriculumVocab = (grade) => {
    const [words, setWords] = React.useState([]);
    const [loading, setLoading] = React.useState(false);

    React.useEffect(() => {
        if (!grade) return;
        if (vocabCache[grade]) { setWords(vocabCache[grade]); return; }

        setLoading(true);
        // 优先从本地JSON加载
        fetch('./vocabulary.json')
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(all => {
                const filtered = all.filter(w => w.grade === grade);
                if (filtered.length > 0) {
                    vocabCache[grade] = filtered.map(w => ({ en: w.word, zh: w.zh, emoji: w.emoji || '📖', sentence: w.sentence, tip: w.tip || '', phonetic: w.phonetic }));
                    setWords(vocabCache[grade]);
                    setLoading(false);
                } else {
                    throw new Error('no data');
                }
            })
            .catch(() => {
                console.error('获取词汇数据失败');
                setWords([]);
                setLoading(false);
            });
    }, [grade]);

    return { words, loading };
};

// =============================================
// 拼写练习组件（初高中年级）
// =============================================
const SpellingPractice = ({ words, onClose, addXP }) => {
    const [idx, setIdx] = useState(0);
    const [input, setInput] = useState('');
    const [result, setResult] = useState(null); // 'correct'|'wrong'|null
    const [score, setScore] = useState(0);
    const [done, setDone] = useState(false);
    const inputRef = useRef(null);
    const practiceWords = useMemo(() => {
        if (!words || words.length === 0) return [];
        return shuffle(words).slice(0, Math.min(words.length, 6));
    }, [words.length]);
    const current = practiceWords[idx];
    if (!current && !done) return null;

    useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, [idx]);

    const handleSpeak = () => speak(current.en);

    const handleSubmit = () => {
        if (!input.trim()) return;
        const correct = input.trim().toLowerCase() === current.en.toLowerCase();
        setResult(correct ? 'correct' : 'wrong');
        if (correct) {
            setScore(s => s + 1);
            addXP && addXP(3);
            playSound('correct');
        } else {
            playSound('wrong');
        }
        setTimeout(() => {
            setResult(null);
            setInput('');
            if (idx + 1 >= practiceWords.length) {
                setDone(true);
            } else {
                setIdx(i => i + 1);
            }
        }, 1200);
    };

    if (done) {
        const total = practiceWords.length;
        const pct = Math.round((score / total) * 100);
        return (
            <div className="fixed inset-0 z-50 flex items-center justify-center px-4"
                 style={{background:'rgba(61,46,61,0.55)', backdropFilter:'blur(4px)'}}>
                <div className="w-full max-w-sm rounded-3xl p-8 text-center shadow-2xl"
                     style={{background:'#FAF3F3'}}>
                    <div className="text-5xl mb-3">{pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '💪'}</div>
                    <h3 className="text-2xl font-bold mb-1" style={{color:'#3D2E3D'}}>拼写练习完成！</h3>
                    <p className="text-4xl font-black mb-2" style={{color:'#5C7995'}}>{score}/{total}</p>
                    <p className="text-sm mb-6" style={{color:'#9B8FA0'}}>
                        {pct >= 80 ? '太棒了，拼写达人！' : pct >= 50 ? '不错哦，继续努力！' : '多练练，你能行！'}
                    </p>
                    <button onClick={onClose}
                        className="w-full py-3 rounded-2xl font-bold text-white text-base"
                        style={{background:'linear-gradient(135deg,#745B72,#5C7995)'}}>
                        完成 ✓
                    </button>
                </div>
            </div>
        );
    }

    return (
        <div className="fixed inset-0 z-50 overflow-y-auto"
             style={{background:'linear-gradient(160deg,#FAF3F3 0%,#F0E8F0 45%,#EAE8F0 100%)'}}>
            {/* 顶部导航 */}
            <div className="sticky top-0 z-10 flex items-center justify-between px-4 py-3 backdrop-blur-md"
                 style={{background:'rgba(250,243,243,0.92)', borderBottom:'1px solid rgba(230,188,188,0.35)'}}>
                <button onClick={onClose} className="flex items-center gap-1.5 px-3 py-2 rounded-full text-sm font-medium"
                    style={{background:'#F5EEEE', color:'#745B72'}}>← 退出</button>
                <span className="font-bold text-sm" style={{color:'#3D2E3D'}}>✍️ 拼写练习 {idx+1}/{practiceWords.length}</span>
                <span className="font-bold text-sm" style={{color:'#5C7995'}}>得分 {score}</span>
            </div>
            <div className="h-1" style={{background:'linear-gradient(90deg,#745B72,#AAABB9,#5C7995)'}} />

            {/* 进度条 */}
            <div className="w-full h-1.5" style={{background:'#F5EEEE'}}>
                <div className="h-full transition-all duration-300" style={{width:`${((idx)/practiceWords.length)*100}%`, background:'linear-gradient(90deg,#745B72,#5C7995)'}} />
            </div>

            <div className="max-w-md mx-auto px-4 py-10">
                {/* 提示区 */}
                <div className="text-center mb-8">
                    <div className="text-7xl mb-4">{current.emoji || '📖'}</div>
                    <p className="text-lg font-medium mb-1" style={{color:'#9B8FA0'}}>请拼写以下单词：</p>
                    <p className="text-2xl font-bold mb-3" style={{color:'#3D2E3D'}}>{current.zh}</p>
                    <button onClick={handleSpeak}
                        className="inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium"
                        style={{background:'#F5EEEE', color:'#745B72', border:'1.5px solid #E6BCBC'}}>
                        🔊 听发音
                    </button>
                </div>

                {/* 输入框 */}
                <div className="relative mb-4">
                    <input
                        ref={inputRef}
                        type="text"
                        value={input}
                        onChange={e => setInput(e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') handleSubmit(); }}
                        placeholder="在此输入英文单词..."
                        disabled={result !== null}
                        className="w-full px-5 py-4 rounded-2xl text-xl font-bold text-center outline-none border-2 transition-all"
                        style={{
                            background:'#fff',
                            borderColor: result === 'correct' ? '#AAABB9' : result === 'wrong' ? '#D49DAA' : '#E6BCBC',
                            color: result === 'correct' ? '#5C7995' : result === 'wrong' ? '#D49DAA' : '#3D2E3D',
                        }}
                    />
                    {result === 'wrong' && (
                        <p className="text-center text-sm mt-2 font-medium" style={{color:'#D49DAA'}}>

                    style={{background:'linear-gradient(135deg,#745B72,#5C7995)'}}>

                </button>
            </div>
        </div>
    );
};

// =============================================
// 虚拟宠物组件（咖色泰迪狗）
// =============================================
const VirtualPet = ({ event, onSpeak }) => {
    const [animation, setAnimation] = useState('idle');
    const [message, setMessage] = useState('');
    const [showMessage, setShowMessage] = useState(false);
    
    // 拖拽状态
    const [pos, setPos] = useState({ x: 16, y: window.innerHeight - 200 }); // 默认位置：左下角
    const [isDragging, setIsDragging] = useState(false);
    const dragRef = useRef({ startX: 0, startY: 0, initX: 0, initY: 0, moved: false });

    // 初始化读取上次位置
    useEffect(() => {
        try {
            const savedPos = localStorage.getItem('eq_pet_pos');
            if (savedPos) {
                const parsed = JSON.parse(savedPos);
                // 确保位置不会超出屏幕边界
                const safeX = Math.min(Math.max(0, parsed.x), window.innerWidth - 80);
                const safeY = Math.min(Math.max(0, parsed.y), window.innerHeight - 100);
                setPos({ x: safeX, y: safeY });
            }
        } catch(e){}
    }, []);

    // 宠物的英文对话库
    const petMessages = {
        learn: ['Great job!', 'Awesome!', 'Keep going!', 'You rock!', 'Well done!'],
        perfect: ['Amazing!', 'Perfect score!', 'You are a star!', 'Brilliant!'],
        streak: ["You're on fire!", 'Keep the streak!', 'So proud of you!'],
        idle: ['Let\'s learn!', 'Ready?', 'Hi there!', 'Tap me!'],
    };

    // 监听事件触发动画和语音
    useEffect(() => {
        if (!event) return;
        const { type } = event;

        if (type === 'learn') {
            setAnimation('jump');
            const msg = petMessages.learn[Math.floor(Math.random() * petMessages.learn.length)];
            setMessage(msg);
            setShowMessage(true);
            speakPetMessage(msg);
            setTimeout(() => { setAnimation('idle'); setShowMessage(false); }, 3000);
        } else if (type === 'perfect') {
            setAnimation('bark');
            const msg = petMessages.perfect[Math.floor(Math.random() * petMessages.perfect.length)];
            setMessage(msg);
            setShowMessage(true);
            speakPetMessage(msg);
            setTimeout(() => { setAnimation('idle'); setShowMessage(false); }, 3500);
        } else if (type === 'streak') {
            setAnimation('jump');
            const msg = petMessages.streak[Math.floor(Math.random() * petMessages.streak.length)];
            setMessage(msg);
            setShowMessage(true);
            speakPetMessage(msg);
            setTimeout(() => { setAnimation('idle'); setShowMessage(false); }, 3000);
        }
    }, [event]);

    // 小男孩音色说话
    const speakPetMessage = (text) => {
        if (!('speechSynthesis' in window)) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 1.1;
        utterance.pitch = 1.5; // 高音调模拟儿童声音
        // 尝试选择儿童/年轻男声
        const voices = speechSynthesis.getVoices();
        const childVoice = voices.find(v =>
            v.lang.startsWith('en') && (v.name.includes('Kid') || v.name.includes('Child') || v.name.includes('Junior'))
        ) || voices.find(v => v.lang.startsWith('en') && v.name.includes('Male'));
        if (childVoice) utterance.voice = childVoice;
        speechSynthesis.speak(utterance);
    };

    // 点击宠物
    const handlePetClick = () => {
        setAnimation('jump');
        const msg = petMessages.idle[Math.floor(Math.random() * petMessages.idle.length)];
        setMessage(msg);
        setShowMessage(true);
        speakPetMessage(msg);
        setTimeout(() => { setAnimation('idle'); setShowMessage(false); }, 2500);
    };

    // --- 拖拽处理逻辑 ---
    const handlePointerDown = (e) => {
        // 兼容鼠标和触摸事件
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        setIsDragging(true);
        dragRef.current = {
            startX: clientX,
            startY: clientY,
            initX: pos.x,
            initY: pos.y,
            moved: false
        };
        
        // 阻止默认行为（特别是图片长按、触摸滚动等）
        if (e.cancelable) e.preventDefault();
    };

    useEffect(() => {
        const handlePointerMove = (e) => {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const dx = clientX - dragRef.current.startX;
            const dy = clientY - dragRef.current.startY;
            
            // 移动超过 3px 才算拖拽
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                dragRef.current.moved = true;
            }
            
            // 限制在屏幕内
            let newX = dragRef.current.initX + dx;
            let newY = dragRef.current.initY + dy;
            newX = Math.min(Math.max(0, newX), window.innerWidth - 80); // 预留宽度
            newY = Math.min(Math.max(0, newY), window.innerHeight - 100); // 预留高度
            
            setPos({ x: newX, y: newY });
        };

        const handlePointerUp = (e) => {
            if (!isDragging) return;
            setIsDragging(false);
            
            // 只有没有发生移动（真正的点击）时，才触发点击对话
            if (!dragRef.current.moved) {
                handlePetClick();
            } else {
                // 如果是拖拽，停止拖拽后保存位置
                try {
                    localStorage.setItem('eq_pet_pos', JSON.stringify(pos));
                } catch(e) {}
            }
        };

        if (isDragging) {
            window.addEventListener('mousemove', handlePointerMove, { passive: false });
            window.addEventListener('mouseup', handlePointerUp);
            window.addEventListener('touchmove', handlePointerMove, { passive: false });
            window.addEventListener('touchend', handlePointerUp);
        }

        return () => {
            window.removeEventListener('mousemove', handlePointerMove);
            window.removeEventListener('mouseup', handlePointerUp);
            window.removeEventListener('touchmove', handlePointerMove);
            window.removeEventListener('touchend', handlePointerUp);
        };
    }, [isDragging, pos]);

    return (
        <div
            onMouseDown={handlePointerDown}
            onTouchStart={handlePointerDown}
            className="fixed z-40 cursor-pointer select-none"
            style={{ 
                width: '130px', 
                left: `${pos.x}px`, 
                top: `${pos.y}px`,
                touchAction: 'none' // 禁用浏览器默认拖拽行为
            }}
        >
            {/* 对话气泡 */}
            {showMessage && (
                <div
                    className="speech-bubble absolute -top-16 left-1/2 -translate-x-1/2 px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap shadow-lg"
                    style={{ background: '#FAF3F3', color: '#745B72', border: '2px solid #E6BCBC' }}
                >
                    {message}
                </div>
            )}
            {/* 泰迪狗 SVG 形象（基于图片手绘） */}
            <div className={`dog-${animation}`}>
                <svg viewBox="0 0 100 100" style={{ width: '100%', height: 'auto', filter: 'drop-shadow(0 4px 8px rgba(116,91,114,0.25))' }}>
                    {/* 尾巴 */}
                    <g style={{ transformOrigin: '20px 75px', animation: animation === 'idle' ? 'dogWagTail 0.3s ease-in-out infinite' : 'none' }}>
                        <path d="M 28 75 Q 12 85 15 65 Q 25 55 28 70 Z" fill="#915133" />

// =============================================
// 番茄时钟组件（15分钟休息提醒）
// =============================================
const PomodoroTimer = ({ onBreakTime, sessionActive }) => {
    const [seconds, setSeconds] = useState(0);
    const [isBreak, setIsBreak] = useState(false);
    const [isPaused, setIsPaused] = useState(false);
    const [isPageVisible, setIsPageVisible] = useState(true);
    const timerRef = useRef(null);
    const lastTickRef = useRef(Date.now());
    const BREAK_INTERVAL = 15 * 60; // 15分钟

    // 页面可见性 API
    useEffect(() => {
        const handleVisibilityChange = () => {
            const visible = document.visibilityState === 'visible';
            setIsPageVisible(visible);
            if (visible && !isPaused && sessionActive) {
                // 回到前台时，重置 lastTickRef，防止累加过多（或者如果需要连续计时，可以在这里处理时间差）
                lastTickRef.current = Date.now();
            }
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);
        return () => {
            document.removeEventListener('visibilitychange', handleVisibilityChange);
        };
    }, [isPaused, sessionActive]);

    const onBreakTimeRef = useRef(onBreakTime);
    useEffect(() => {
        onBreakTimeRef.current = onBreakTime;
    }, [onBreakTime]);

    // 计时器逻辑
    useEffect(() => {
        // 如果未登录或休息时间，重置并停止
        if (!sessionActive) {
            setSeconds(0);
            setIsBreak(false);
            return;
        }

        // 仅在用户手动点击暂停时停止计时，页面不可见(切后台)或看详情页时均保持计时
        if (isPaused) {
            if (timerRef.current) {
                clearInterval(timerRef.current);
                timerRef.current = null;
            }
            return;
        }

        lastTickRef.current = Date.now();
        timerRef.current = setInterval(() => {
            const now = Date.now();
            const delta = Math.floor((now - lastTickRef.current) / 1000);
            
            if (delta > 0) {
                lastTickRef.current = now;
                setSeconds(s => {
                    const next = s + delta;
                    if (next >= BREAK_INTERVAL && !isBreak) {
                        setIsBreak(true);
                        if (onBreakTimeRef.current) onBreakTimeRef.current();
                        return 0;
                    }
                    return next;
                });
            }
        }, 1000);

        return () => {
            if (timerRef.current) {
                clearInterval(timerRef.current);
                timerRef.current = null;
            }
        };
    }, [sessionActive, isBreak, isPaused]);

    const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
    };

    const handleTogglePause = () => {
        setIsPaused(prev => !prev);
    };

    const progress = (seconds / BREAK_INTERVAL) * 100;

    return (
        <div
            className={`pomodoro-timer ${isBreak ? 'break-time' : ''} ${isPaused ? 'paused' : ''}`}
            title={isBreak ? '休息时间到！' : `学习时间: ${formatTime(seconds)}`}
            onClick={handleTogglePause}
        >
            <span style={{ fontSize: '16px' }}>{isBreak ? '🍅' : (isPaused ? '⏸️' : '⏱️')}</span>
            <span>{isBreak ? '休息!' : (isPaused ? '已暂停' : formatTime(seconds))}</span>
            {!isBreak && (
                <div className="w-8 h-1.5 rounded-full overflow-hidden" style={{ background: 'rgba(255,255,255,0.3)' }}>
                    <div className="h-full rounded-full transition-all" style={{ width: `${progress}%`, background: '#FAF3F3' }} />
                </div>
            )}
        </div>
    );
};
