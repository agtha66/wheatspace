const BreakGame = ({ onClose, onComplete }) => {
    const [currentAction, setCurrentAction] = useState(0);
    const [actionComplete, setActionComplete] = useState(false);
    const [cameraReady, setCameraReady] = useState(false);
    const [detected, setDetected] = useState(false);
    const [skipCount, setSkipCount] = useState(0);
    const videoRef = useRef(null);
    const canvasRef = useRef(null);
    const poseRef = useRef(null);

    // 英文动作指令库
    const ACTIONS = [
        { text: 'Jump 3 times!', emoji: '🦘', checkPose: 'jump' },
        { text: 'Touch your nose!', emoji: '👃', checkPose: 'touch_nose' },
        { text: 'Raise both hands!', emoji: '🙌', checkPose: 'raise_hands' },
        { text: 'Turn around!', emoji: '🔄', checkPose: 'turn' },
        { text: 'Clap 5 times!', emoji: '👏', checkPose: 'clap' },
        { text: 'Touch your toes!', emoji: '🦶', checkPose: 'touch_toes' },
    ];

    const [actions] = useState(() => shuffle([...ACTIONS]).slice(0, 3));

    // 初始化摄像头和姿态检测
    useEffect(() => {
        const initCamera = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                if (videoRef.current) {
                    videoRef.current.srcObject = stream;
                    await videoRef.current.play();
                    setCameraReady(true);
                    initPoseDetection();
                }
            } catch (err) {
                console.log('Camera not available:', err);
                setCameraReady(false);
            }
        };

        const initPoseDetection = () => {
            if (typeof window.Pose === 'undefined') {
                console.log('MediaPipe Pose not loaded');
                return;
            }

            const pose = new window.Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`
            });

            pose.setOptions({
                modelComplexity: 0, // 轻量级
                smoothLandmarks: true,
                enableSegmentation: false,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            pose.onResults(onPoseResults);
            poseRef.current = pose;

            // 启动检测循环
            const camera = new window.Camera(videoRef.current, {
                onFrame: async () => {
                    if (poseRef.current && videoRef.current) {
                        await poseRef.current.send({ image: videoRef.current });
                    }
                },
                width: 320,
                height: 240
            });
            camera.start();
        };

        initCamera();

        return () => {
            if (videoRef.current && videoRef.current.srcObject) {
                videoRef.current.srcObject.getTracks().forEach(t => t.stop());
            }
        };
    }, []);

    // 处理姿态检测结果
    const onPoseResults = (results) => {
        if (!results.poseLandmarks) return;

        const landmarks = results.poseLandmarks;
        const action = actions[currentAction];
        if (!action) return;

        let detected = false;

        // 简化的姿态检测逻辑
        if (action.checkPose === 'raise_hands') {
            // 双手举过头顶
            const leftWrist = landmarks[15];
            const rightWrist = landmarks[16];
            const nose = landmarks[0];
            if (leftWrist && rightWrist && nose) {
                detected = leftWrist.y < nose.y - 0.1 && rightWrist.y < nose.y - 0.1;
            }
        } else if (action.checkPose === 'touch_nose') {
            // 手接近鼻子
            const leftWrist = landmarks[15];
            const rightWrist = landmarks[16];
            const nose = landmarks[0];
            if (leftWrist && rightWrist && nose) {
                const distL = Math.sqrt(Math.pow(leftWrist.x - nose.x, 2) + Math.pow(leftWrist.y - nose.y, 2));
                const distR = Math.sqrt(Math.pow(rightWrist.x - nose.x, 2) + Math.pow(rightWrist.y - nose.y, 2));
                detected = distL < 0.15 || distR < 0.15;
            }
        }
        // 其他动作简化为随机检测（实际产品需要更精确的算法）
        else {
            // 对于jump/clap/turn等动态动作，使用简化的检测
            detected = Math.random() > 0.98; // 偶尔触发
        }

        if (detected && !actionComplete) {
            setDetected(true);
            setActionComplete(true);
            playSound('correct');

            setTimeout(() => {
                if (currentAction + 1 >= actions.length) {
                    // 全部完成
                    onComplete && onComplete();
                } else {
                    setCurrentAction(c => c + 1);
                    setActionComplete(false);
                    setDetected(false);
                }
            }, 1500);
        }

        // 绘制骨架（可选）
        if (canvasRef.current && results.poseLandmarks) {
            const ctx = canvasRef.current.getContext('2d');
            ctx.clearRect(0, 0, 320, 240);
            // 可以绘制骨架点
            landmarks.forEach(lm => {
                if (lm.visibility > 0.5) {
                    ctx.beginPath();
                    ctx.arc(lm.x * 320, lm.y * 240, 3, 0, 2 * Math.PI);
                    ctx.fillStyle = '#5C7995';
                    ctx.fill();
                }
            });
        }
    };

    // 跳过当前动作
    const handleSkip = () => {
        setSkipCount(s => s + 1);
        if (currentAction + 1 >= actions.length) {
            onComplete && onComplete();
        } else {
            setCurrentAction(c => c + 1);
            setActionComplete(false);
            setDetected(false);
        }
    };

    return (
        <div className="fixed inset-0 z-50 flex flex-col items-center justify-center px-4"
             style={{ background: 'linear-gradient(160deg, #FAF3F3, #F0E8F0, #EAE8F0)' }}>
            {/* 关闭按钮 */}
            <button onClick={onClose}
                className="absolute top-4 right-4 w-10 h-10 rounded-full flex items-center justify-center"
                style={{ background: '#F5EEEE', color: '#745B72' }}>
                ✕
            </button>

            <h2 className="text-2xl font-bold mb-2" style={{ color: '#745B72' }}>🎮 休息时间！</h2>
            <p className="text-sm mb-6" style={{ color: '#9B8FA0' }}>完成动作休息一下眼睛吧</p>

            {/* 当前动作 */}
            <div className="w-full max-w-sm rounded-3xl p-6 mb-4 text-center bounce-in"
                 style={{ background: '#fff', boxShadow: '0 8px 32px rgba(116,91,114,0.15)' }}>
                <div className="text-6xl mb-3">{actions[currentAction]?.emoji}</div>
                <p className="text-xl font-bold" style={{ color: '#3D2E3D' }}>{actions[currentAction]?.text}</p>
                {detected && <p className="text-green-500 font-bold mt-2">✓ 检测到!</p>}
            </div>

            {/* 进度 */}
            <div className="flex gap-2 mb-6">
                {actions.map((_, i) => (
                    <div key={i} className={`w-3 h-3 rounded-full ${i < currentAction ? 'bg-green-400' : i === currentAction ? 'bg-quest-purple' : 'bg-gray-200'}`} />
                ))}
            </div>

            {/* 摄像头预览 */}
            <div className="relative w-64 h-48 rounded-2xl overflow-hidden mb-4" style={{ background: '#000' }}>
                <video ref={videoRef} className="w-full h-full object-cover" playsInline muted />
                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full" width={320} height={240} />
                {!cameraReady && (
                    <div className="absolute inset-0 flex items-center justify-center text-white text-sm">
                        正在启动摄像头...
                    </div>
                )}
            </div>

            {/* 按钮 */}
            <div className="flex gap-3">
                <button onClick={handleSkip}
                    className="px-6 py-3 rounded-2xl font-medium"
                    style={{ background: '#F5EEEE', color: '#9B8FA0' }}>
                    跳过 ({skipCount}/3)
                </button>
                <button onClick={onClose}
                    className="px-6 py-3 rounded-2xl font-bold text-white"
                    style={{ background: 'linear-gradient(135deg, #745B72, #5C7995)' }}>
                    继续学习
                </button>
            </div>

            <p className="text-xs mt-4" style={{ color: '#AAABB9' }}>
                💡 姿态检测需要摄像头权限，也可以点击跳过
            </p>
        </div>
    );
};


const WordGarden = ({ playerData, addXP, onLearnWord, customWords, dailyLogs, onOpenWordDetail, updatePlayer, updateTodayLog, wordProgress, globalGrade, setGlobalGrade }) => {
    const [mode, setMode] = useState('curriculum'); // 'curriculum' | 'custom'
    const [showFlip, setShowFlip] = useState(false);
    const [showAll, setShowAll] = useState(false);
    const [showGradeMenu, setShowGradeMenu] = useState(false);
    const [spellingPrompt, setSpellingPrompt] = useState(false);
    const [showSpelling, setShowSpelling] = useState(false);
    const [viewedWords, setViewedWords] = useState(new Set());

    const { words: currWords, loading } = useCurriculumVocab(mode === 'curriculum' ? globalGrade : null);
    const currentGradeInfo = CURRICULUM_BANKS.find(b => b.key === globalGrade) || CURRICULUM_BANKS[0];
    const isMiddleOrHigh = globalGrade.startsWith('junior') || globalGrade.startsWith('senior');

    const allWords = mode === 'custom' ? customWords : currWords;
    const dailyWords = mode === 'custom' ? customWords : (() => {
        if (currWords.length === 0) return [];
        const today = getTodayStr();
        const log = dailyLogs[today] || {};
        const limit = 20 + (log.extraLimit || 0);
        
        // Find review words (Ebbinghaus)
        let reviewWords = [];
        const learnedEn = new Set(Object.keys(wordProgress || {}));
        if (wordProgress) {
            const now = Date.now();
            const toReview = Object.keys(wordProgress).filter(en => now >= wordProgress[en].nextReview);
            reviewWords = currWords.filter(w => toReview.includes(w.en)).slice(0, limit);
        }
        
        const remaining = limit - reviewWords.length;
        const seed = today.split('-').reduce((a, b) => a + parseInt(b), 0);
        const selected = []; 
        const used = new Set();
        const reviewEn = new Set(reviewWords.map(w => w.en));
        
        // Pick words not in review and not already learned
        for (let i = 0; i < currWords.length && selected.length < remaining; i++) {
            const idx = (seed * (i + 1) * 7 + i * 13) % currWords.length;
            if (!used.has(idx) && !reviewEn.has(currWords[idx].en) && !learnedEn.has(currWords[idx].en)) { 
                used.add(idx); 
                selected.push(currWords[idx]); 
            }
        }
        // If we don't have enough unlearned words, pick sequentially from unlearned
        if (selected.length < remaining) {
            for (let i = 0; i < currWords.length && selected.length < remaining; i++) {
                if (!used.has(i) && !reviewEn.has(currWords[i].en) && !learnedEn.has(currWords[i].en)) {
                    used.add(i);
                    selected.push(currWords[i]);
                }
            }
        }
        // If still not enough (e.g. user learned everything), pick any not in today's review
        if (selected.length < remaining) {
            for (let i = 0; i < currWords.length && selected.length < remaining; i++) {
                if (!used.has(i) && !reviewEn.has(currWords[i].en)) {
                    used.add(i);
                    selected.push(currWords[i]);
                }
            }
        }
        return [...reviewWords, ...selected];
    })();
    const words = showAll || mode === 'custom' ? allWords : dailyWords;
    const taskComplete = isDailyTaskComplete(dailyLogs);

    // 当用户查看了所有今日单词（初高中），弹出拼写邀请
    const handleOpenDetail = (word) => {
        if (onOpenWordDetail) onOpenWordDetail(word);
        if (isMiddleOrHigh && mode === 'curriculum' && !showAll) {
            const newViewed = new Set(viewedWords);
            newViewed.add(word.en);
            setViewedWords(newViewed);
            if (newViewed.size >= words.length && words.length > 0 && !spellingPrompt && !showSpelling) {
                setTimeout(() => setSpellingPrompt(true), 800);
            }
        }
    };

    return (
        <div className="slide-up">
            {/* 拼写练习邀请弹窗 */}
            {spellingPrompt && (
                <div className="fixed inset-0 z-50 flex items-center justify-center px-4"
                     style={{background:'rgba(61,46,61,0.5)', backdropFilter:'blur(4px)'}}>
                    <div className="w-full max-w-sm rounded-3xl p-7 shadow-2xl bounce-in"
                         style={{background:'#FAF3F3'}}>
                        <div className="text-4xl text-center mb-3">✍️</div>
                        <h3 className="text-xl font-bold text-center mb-2" style={{color:'#3D2E3D'}}>今日单词学完啦！</h3>
                        <p className="text-sm text-center mb-6" style={{color:'#9B8FA0'}}>
                            要进行<span className="font-bold" style={{color:'#745B72'}}>拼写练习</span>来巩固今天学的单词吗？
                        </p>
                        <div className="flex gap-3">
                            <button onClick={() => setSpellingPrompt(false)}
                                className="flex-1 py-3 rounded-2xl font-medium text-sm"
                                style={{background:'#F5EEEE', color:'#9B8FA0'}}>
                                稍后再说
                            </button>
                            <button onClick={() => { setSpellingPrompt(false); setShowSpelling(true); }}
                                className="flex-1 py-3 rounded-2xl font-bold text-white text-sm shadow-md"
                                style={{background:'linear-gradient(135deg,#745B72,#5C7995)'}}>
                                开始拼写 ✍️
                            </button>
                        </div>
                    </div>
                </div>
            )}
            {/* 拼写练习全屏页 */}
            {showSpelling && (
                <SpellingPractice words={words} onClose={() => setShowSpelling(false)} addXP={addXP} />
            )}

            {/* 模式切换：课程标准 / 我的单词 */}
            <div className="flex gap-2 mb-3">
                <button onClick={() => { setMode('curriculum'); setShowFlip(false); }}
                    className={`flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 ${mode === 'curriculum' ? 'text-white shadow-md' : 'bg-white'}`}
                    style={mode === 'curriculum' ? { background: 'linear-gradient(135deg, #745B72, #5C7995)', color:'#FAF3F3' } : {color:'#9B8FA0'}}>
                    📚 课程标准词库
                </button>
                <button onClick={() => { setMode('custom'); setShowFlip(false); }}
                    className={`flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 ${mode === 'custom' ? 'text-white shadow-md' : 'bg-white'}`}
                    style={mode === 'custom' ? { background: 'linear-gradient(135deg, #5C7995, #AAABB9)', color:'#fff' } : {color:'#9B8FA0'}}>
                    ✏️ 我的单词
                </button>
            </div>

            {/* 年级选择器（课程标准模式） */}
            {mode === 'curriculum' && (
                <div className="mb-3">
                    <button onClick={() => setShowGradeMenu(v => !v)}
                        className="w-full flex items-center justify-between px-4 py-3 rounded-2xl bg-white shadow-card font-medium text-sm"
                        style={{color:'#3D2E3D'}}>
                        <span>{currentGradeInfo.emoji} {currentGradeInfo.label}</span>
                        <span className="text-xs" style={{color:'#9B8FA0'}}>{showGradeMenu ? '▲ 收起' : '▼ 选择年级'}</span>
                    </button>
                    {showGradeMenu && (
                        <div className="mt-2 bg-white rounded-2xl shadow-card p-3 grid grid-cols-3 gap-2">
                            {CURRICULUM_BANKS.map(b => (
                                <button key={b.key}
                                    onClick={() => { setGlobalGrade(b.key); setShowGradeMenu(false); setShowAll(false); setShowFlip(false); setViewedWords(new Set()); setSpellingPrompt(false); }}
                                    className="py-2 px-1 rounded-xl text-xs font-medium transition-all text-center"
                                    style={globalGrade === b.key ? { background: 'linear-gradient(135deg, #745B72, #5C7995)', color:'#FAF3F3' } : {background:'#F5EEEE', color:'#3D2E3D'}}>
                                    {b.emoji}<br/>{b.label}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            )}

            {/* 今日单词/全部切换（课程标准模式） */}
            {mode === 'curriculum' && (
                <div className="flex flex-col mb-4">
                    <div className="flex items-center justify-between rounded-2xl p-3" style={{background:'rgba(230,188,188,0.18)'}}>
                        <div className="flex items-center gap-2">
                            <span className="text-lg">{taskComplete ? '✅' : '📅'}</span>
                            <div>
                                <p className="text-sm font-bold" style={{color:'#3D2E3D'}}>
                                    {loading ? '加载中…' : taskComplete ? '今日任务已完成！' : `今日单词 · ${currentGradeInfo.label}`}
                                </p>
                                <p className="text-xs" style={{color:'#9B8FA0'}}>
                                    {loading ? '' : taskComplete ? '明天将更新新单词' : `共 ${allWords.length} 词，每日${20 + ((dailyLogs[getTodayStr()] || {}).extraLimit || 0)}个`}
                                </p>
                            </div>
                        </div>
                        <button onClick={() => setShowAll(v => !v)}
                            className="px-3 py-1.5 rounded-full text-xs font-medium transition-all"
                            style={showAll ? {background:'#5C7995', color:'#fff'} : {background:'#fff', color:'#745B72', border:'1px solid #E6BCBC'}}>
                            {showAll ? '📅 今日单词' : '📚 全部单词'}
                        </button>
                    </div>
                    {taskComplete && !showAll && (
                        <div className="mt-2 p-3 rounded-2xl bg-white shadow-sm border flex flex-col items-center" style={{borderColor: '#F5EEEE'}}>
                            <p className="text-xs font-bold mb-2" style={{color:'#745B72'}}>想要继续挑战吗？选择加量学习：</p>
                            <div className="flex gap-2">
                                {[10, 15, 20].map(amount => (
                                    <button key={amount} onClick={() => {
                                        if(updateTodayLog) {
                                            updateTodayLog(log => ({ ...log, extraLimit: (log.extraLimit || 0) + amount }));
                                        }
                                    }}
                                    className="px-3 py-1 rounded-full text-xs font-medium bg-gray-50 hover:bg-gray-100 transition-all text-gray-600 border border-gray-200">
                                        +{amount} 词
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            )}

            {loading ? (
                <div className="text-center py-16" style={{color:'#9B8FA0'}}>
                    <div className="text-4xl mb-3 animate-spin">⏳</div>
                    <p>正在加载词汇…</p>
                </div>
            ) : words.length === 0 ? (
                <div className="text-center py-16" style={{color:'#9B8FA0'}}>
                    <div className="text-5xl mb-3">📭</div>
                    <p>{mode === 'custom' ? '还没有自定义单词哦，去成就馆添加吧！' : '暂无词汇数据'}</p>
                </div>
            ) : (
                <>
                    {/* 单词卡片网格 */}
                    <div className="word-grid grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4 mb-6">
                        {words.map((word, i) => (

                    {/* 翻牌游戏入口 */}
                    <div className="rounded-3xl p-5 mb-2" style={{ background: 'linear-gradient(135deg, #745B72, #8A6888)' }}>

                    </div>
                    {/* 拼写练习入口（初高中手动入口） */}
                    {isMiddleOrHigh && mode === 'curriculum' && (
                        <div className="rounded-3xl p-5 mt-3" style={{background:'linear-gradient(135deg,#5C7995,#8A9BB5)'}}>
                            <div className="flex justify-between items-center">
                                <div>
                                    <p className="font-bold text-white text-lg">✍️ 拼写练习</p>
                                    <p className="text-xs mt-0.5" style={{color:'#E6BCBC'}}>拼对一词得 +3 XP</p>
                                </div>
                                <button onClick={() => setShowSpelling(true)}
                                    className="px-5 py-2.5 rounded-full font-bold text-sm transition-all hover:scale-105 shadow-md"
                                    style={{background:'#FAF3F3', color:'#745B72'}}>
                                    开始拼写 ✍️
                                </button>
                            </div>
                        </div>
                    )}
                </>
            )}
        </div>
    );
};

const SentenceCard = ({ sentence, idx }) => {
    const [speaking, setSpeaking] = useState(false);
    const [answer, setAnswer] = useState(null);
    const [shake, setShake] = useState(false);
    const words = sentence.en.split(' ');
    
    // 随机打乱选项，避免正确答案总是在第一个
    const shuffledOptions = useMemo(() => shuffle(sentence.options), [sentence.options]);

    const handleSpeak = () => {
        setSpeaking(true);
        speak(sentence.en);
        setTimeout(() => setSpeaking(false), 2500);
    };
    const handleAnswer = (opt) => {
        setAnswer(opt);
        const correct = opt === sentence.blank;
        playSound(correct ? 'correct' : 'wrong');
        if (!correct) {
            setShake(true);
            setTimeout(() => setShake(false), 500);
        }
    };
    return (
        <div className="bg-white rounded-3xl p-5 shadow-card mb-4 bounce-in" style={{ animationDelay: idx * 0.07 + 's' }}>
            <div className="flex items-start gap-3 mb-3">
                <div className="w-1 self-stretch rounded-full flex-shrink-0" style={{ background: 'linear-gradient(180deg, #5C7995, #D49DAA)', minHeight: 40 }} />
                <div className="flex-1">
                    <p className="text-base font-semibold text-quest-dark leading-relaxed">
                        {words.map((w, i) => {
                            const clean = w.replace(/[.,!?]/, '');
                            if (clean === sentence.blank) {
                                return (
                                    <span key={i}>
                                        {answer
                                            ? <span className={`px-1.5 py-0.5 rounded font-bold ${answer === sentence.blank ? 'bg-quest-green text-white' : 'bg-quest-coral text-white'}`}>{answer}</span>
                                            : <span className="px-3 py-0.5 rounded border-b-2 border-quest-orange text-quest-orange font-bold bg-orange-50">____</span>
                                        }{w.slice(clean.length)}{' '}
                                    </span>
                                );
                            }
                            return <span key={i}>{w} </span>;
                        })}
                    </p>
                    <p className="text-sm text-quest-muted mt-1.5">{sentence.zh}</p>
                </div>
                <button onClick={handleSpeak}
                    className={`flex-shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition-all ${speaking ? 'bg-quest-teal text-white scale-90' : 'bg-quest-mint text-quest-teal hover:bg-quest-teal hover:text-white'}`}>
                    🔊
                </button>
            </div>
            {/* 填空选项 */}
            <div className={`grid grid-cols-2 gap-2 mt-3 ${shake ? 'shake' : ''}`}>
                {shuffledOptions.map(opt => (
                    <button key={opt} onClick={() => handleAnswer(opt)} disabled={!!answer}
                        className={`option-btn py-2.5 px-3 rounded-2xl text-sm font-medium bg-gray-50 text-quest-dark
                            ${answer === opt && opt === sentence.blank ? 'correct correct-bounce' : ''}
                            ${answer === opt && opt !== sentence.blank ? 'wrong' : ''}
                            ${answer && opt === sentence.blank && answer !== opt ? 'reveal' : ''}
                            disabled:cursor-default`}>
                        {opt}
                    </button>
                ))}
            </div>
            {answer && (
                <div className={`mt-3 text-sm rounded-2xl px-4 py-2 font-medium ${answer === sentence.blank ? 'bg-green-50 text-green-600' : 'bg-orange-50 text-quest-orange'}`}>
                    {answer === sentence.blank ? '✅ 太棒了！答对了！' : `💡 正确答案是：${sentence.blank}，加油！`}
                </div>
            )}
        </div>
    );
};

const SentenceQuest = ({ globalGrade }) => {
    const [level, setLevel] = useState('easy');
    const filtered = useMemo(() => {
        const todayStr = getTodayStr();
        let hash = 0;
        for (let i = 0; i < todayStr.length; i++) hash += todayStr.charCodeAt(i);
        
        const levelSentences = SENTENCES.filter(s => s.level === level);
        if (levelSentences.length <= 3) return levelSentences;
        
        const startIndex = hash % levelSentences.length;
        const selected = [];
        for (let i = 0; i < 3; i++) {
            selected.push(levelSentences[(startIndex + i) % levelSentences.length]);
        }
        return selected;
    }, [level]);

    return (
        <div className="slide-up">
            <div className="flex gap-3 mb-5">
                {[{ k: 'easy', l: '简单句', e: '🐣' }, { k: 'medium', l: '进阶句', e: '🦅' }].map(b => (
                    <button key={b.k} onClick={() => setLevel(b.k)}
                        className={`flex items-center gap-1.5 px-5 py-2 rounded-full text-sm font-medium transition-all ${level === b.k ? 'text-white shadow-md' : 'bg-white text-quest-muted hover:bg-quest-mint'}`}
                        style={level === b.k ? { background: 'linear-gradient(135deg, #745B72, #5C7995)' } : {}}>
                        {b.e} {b.l}
                    </button>
                ))}
            </div>
            {filtered.map((s, i) => <SentenceCard key={s.en} sentence={s} idx={i} />)}
        </div>
    );
};

const ChallengeMode = ({ allWords, addXP, onPerfect }) => {
    const [phase, setPhase] = useState('intro');
    const [quiz, setQuiz] = useState([]);
    const [current, setCurrent] = useState(0);
    const [selected, setSelected] = useState(null);
    const [score, setScore] = useState(0);
    const [celebrate, setCelebrate] = useState(false);
    const [answers, setAnswers] = useState([]);
    const encMap = { zh2en: '看中文选英文', emoji2en: '看图猜单词', en2zh: '看英文选中文' };

    // 随机生成题目
    const generateQuiz = useCallback((words) => {
        if (words.length < 4) return [];
        const types = ['en2zh', 'zh2en', 'emoji2en'];
        const list = [];
        const pool = [...words];
        
        // 辅助函数：洗牌算法打乱数组
        const shuffleOptions = (arr) => {
            const result = [...arr];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        };

        for (let i = 0; i < 5; i++) {
            const word = pool[Math.floor(Math.random() * pool.length)];
            const type = types[Math.floor(Math.random() * types.length)];
            const others = pool.filter(w => w.en !== word.en).sort(() => 0.5 - Math.random()).slice(0, 3);
            let q = { type, word, answer: '', options: [] };
            if (type === 'en2zh') {
                q.question = word.en;
                q.answer = word.zh;
                q.options = shuffleOptions([word.zh, ...others.map(w => w.zh)]);
            } else if (type === 'zh2en') {
                q.question = word.zh;
                q.answer = word.en;
                q.options = shuffleOptions([word.en, ...others.map(w => w.en)]);
            } else {
                q.question = word.emoji;
                q.answer = word.en;
                q.options = shuffleOptions([word.en, ...others.map(w => w.en)]);
            }
            list.push(q);
        }
        return list;
    }, []);

    const startQuiz = () => {
        const fallback = [...WORD_BANKS.primary1, ...WORD_BANKS.primary2];
        const q = generateQuiz(allWords.length >= 5 ? allWords : fallback);
        setQuiz(q);
        setCurrent(0);
        setSelected(null);
        setScore(0);
        setAnswers([]);
        setPhase('playing');
    };

    const handleSelect = (opt) => {
        if (selected) return;
        setSelected(opt);
        const q = quiz[current];
        const correct = opt === q.answer;
        playSound(correct ? 'correct' : 'wrong');
        if (correct) {
            addXP(10);
            setScore(s => s + 1);
        }
        setAnswers(prev => [...prev, correct]);
        if (current < 4) {
            setTimeout(() => { setCurrent(c => c + 1); setSelected(null); }, 1200);
        } else {
            setTimeout(() => {
                setPhase('result');
                const finalScore = score + (correct ? 1 : 0);
                if (finalScore === 5) { setCelebrate(true); onPerfect(); }
            }, 1200);
        }
    };

    const finalScore = answers.filter(Boolean).length;
    const stars = finalScore >= 5 ? 3 : finalScore >= 3 ? 2 : 1;

    if (phase === 'intro') return (
        <div className="slide-up flex flex-col items-center justify-center min-h-[60vh] text-center">
            <div className="text-6xl mb-4 bounce-in">⚔️</div>
            <h2 className="text-2xl font-bold text-quest-dark mb-2">挑战模式</h2>
            <p className="text-quest-muted mb-8 max-w-xs">5 题闯关，答对得 XP，全对解锁徽章！每次都是全新挑战！</p>
            <div className="grid grid-cols-3 gap-4 mb-8">
                {[['zh2en','👁️','看中选英'],['emoji2en','🖼️','看图猜词'],['en2zh','🔤','看英选中']].map(([k, e, l]) => (
                    <div key={k} className="bg-white rounded-2xl p-3 shadow-card text-center">
                        <div className="text-2xl mb-1">{e}</div>
                        <div className="text-xs text-quest-muted font-medium">{l}</div>
                    </div>
                ))}
            </div>
            <button onClick={startQuiz}
                className="px-10 py-4 rounded-full text-white font-bold text-lg shadow-glow-orange hover:scale-105 transition-all"
                style={{ background: 'linear-gradient(135deg, #5C7995, #745B72)' }}>
                开始挑战 🚀
            </button>
        </div>
    );

    if (phase === 'result') return (
        <div className="slide-up flex flex-col items-center justify-center min-h-[60vh] text-center">
            {celebrate && <CelebrationEffect onDone={() => setCelebrate(false)} />}
            <div className="text-5xl mb-4">
                {[1,2,3].map(s => (
                    <span key={s} className={`star-pop inline-block mr-1`} style={{ animationDelay: s * 0.2 + 's', filter: s <= stars ? 'none' : 'grayscale(1) opacity(0.3)' }}>⭐</span>
                ))}
            </div>
            <h2 className="text-2xl font-bold text-quest-dark mb-1">{finalScore === 5 ? '完美！太厉害了！' : finalScore >= 3 ? '很不错！继续加油！' : '没关系，再来一次！'}</h2>
            <p className="text-quest-muted mb-2">答对 {finalScore} / 5 题</p>
            <p className="text-quest-orange font-bold mb-8">+{finalScore * 10} XP 已获得！</p>
            <div className="flex gap-4">
                {answers.map((a, i) => (
                    <div key={i} className={`w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm ${a ? 'bg-quest-green' : 'bg-quest-coral'}`}>
                        {a ? '✓' : '✗'}
                    </div>
                ))}
            </div>
            <button onClick={startQuiz} className="mt-8 px-8 py-3 rounded-full text-white font-bold shadow-md hover:scale-105 transition-all"
                style={{ background: 'linear-gradient(135deg, #5C7995, #745B72)' }}>
                再来一关 🔄
            </button>
        </div>
    );

    const q = quiz[current];
    return (
        <div className="slide-up">
            {/* 进度点 */}
            <div className="flex justify-center gap-3 mb-6">
                {[0,1,2,3,4].map(i => (
                    <div key={i} className={`quiz-dot w-3 h-3 rounded-full ${i < current ? 'done' : i === current ? 'current' : 'pending bg-gray-200'}`} />
                ))}
            </div>
            {/* 题目卡 */}
            <div className="rounded-3xl p-6 mb-5 text-center" style={{ background: 'linear-gradient(135deg, #745B72, #8A6888)' }}>
                <div className="text-xs mb-3 font-medium tracking-wider uppercase" style={{color:'#E6BCBC'}}>{encMap[q.type]}</div>
                {q.type === 'emoji2en' ? (
                    <div className="text-7xl mb-2">{q.question}</div>
                ) : (
                    <div className="text-2xl font-bold text-white mb-2">{q.question}</div>
                )}
                {q.type === 'emoji2en' && (
                    <button onClick={() => speak(q.word.en)} className="mt-1 text-xs hover:text-white flex items-center gap-1 mx-auto" style={{color:'#E6BCBC'}}>
                        🔊 听发音
                    </button>
                )}
                <div className="text-sm mt-1" style={{color:'#E6BCBC'}}>第 {current + 1} / 5 题</div>
            </div>
            {/* 选项 */}
            <div className="grid grid-cols-2 gap-3">
                {q.options.map(opt => (
                    <button key={opt} onClick={() => handleSelect(opt)} disabled={!!selected}
                        className={`option-btn py-4 px-4 rounded-2xl text-sm font-bold bg-white text-quest-dark shadow-card
                            ${selected === opt && opt === q.answer ? 'correct correct-bounce' : ''}
                            ${selected === opt && opt !== q.answer ? 'wrong shake' : ''}
                            ${selected && opt === q.answer && selected !== opt ? 'reveal' : ''}
                            disabled:cursor-default`}>
                        {opt}
                    </button>
                ))}
            </div>
            {selected && (
                <div className={`mt-4 text-sm rounded-2xl px-4 py-3 text-center font-medium bounce-in-sm ${selected === q.answer ? 'bg-green-50 text-green-600' : 'bg-orange-50 text-quest-orange'}`}>
                    {selected === q.answer ? '🎉 答对了！+10 XP' : ENCOURAGEMENTS[Math.floor(Math.random() * ENCOURAGEMENTS.length)]}
                </div>
            )}
        </div>
    );
};

const AchievementHub = ({ playerData, badges, customWords, onAddWord, onDeleteWord, addXP }) => {
    const [newWord, setNewWord] = useState({ 
        en: '', 
        zh: '', 
        emoji: '', 
        partOfSpeech: 'noun', 
        pronunciation: '', 
        example: '', 
        category: 'general' 
    });
    const [adding, setAdding] = useState(false);
    const { level } = calcLevel(playerData.xp);
    const correctRate = playerData.totalAnswers > 0
        ? Math.round((playerData.correctAnswers / playerData.totalAnswers) * 100) : 0;

    const handleAdd = () => {
        if (!newWord.en.trim() || !newWord.zh.trim()) return;
        const word = {
            en: newWord.en.trim().toLowerCase(),
            zh: newWord.zh.trim(),
            emoji: newWord.emoji.trim() || '📝',
            partOfSpeech: newWord.partOfSpeech,
            pronunciation: newWord.pronunciation.trim() || newWord.en.trim().toLowerCase(),
            example: newWord.example.trim() || `${newWord.en} is a new word I learned.`,
            category: newWord.category,
            sentence: `${newWord.en} is a new word I learned.`,
        };
        onAddWord(word);
        addXP(5);
        setNewWord({ 
            en: '', 
            zh: '', 
            emoji: '', 
            partOfSpeech: 'noun', 
            pronunciation: '', 
            example: '', 
            category: 'general' 
        });
        setAdding(false);
    };

    const handleExport = () => {
        const dataStr = JSON.stringify(customWords, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = window.URL.createObjectURL(dataBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `englishquest_words_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(url);
    };

    const handleImport = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported)) {
                    imported.forEach(word => {
                        const validWord = {
                            en: word.en || '',
                            zh: word.zh || '',
                            emoji: word.emoji || '📝',
                            partOfSpeech: word.partOfSpeech || 'noun',
                            pronunciation: word.pronunciation || word.en || '',
                            example: word.example || `${word.en || ''} is a new word I learned.`,
                            category: word.category || 'general',
                            sentence: word.sentence || `${word.en || ''} is a new word I learned.`,
                        };
                        if (validWord.en && validWord.zh) {
                            onAddWord(validWord);
                        }
                    });
                    addXP(imported.length * 2); // 奖励XP
                    alert(`成功导入 ${imported.length} 个单词！`);
                } else {
                    alert('导入失败：文件格式不正确');
                }
            } catch (err) {
                alert('导入失败：文件格式错误');
            }
        };
        reader.readAsText(file);
        event.target.value = ''; // 重置文件输入
    };

    return (
        <div className="slide-up space-y-5">
            {/* 今日统计 */}
            <div className="rounded-3xl p-5 text-white" style={{ background: 'linear-gradient(135deg, #745B72, #5C7995)' }}>
                <div className="flex justify-between items-start mb-4">
                    <div>
                        <p className="text-sm" style={{color:'#E6BCBC'}}>今日学习概览</p>
                        <p className="font-bold text-lg">{new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' })}</p>
                    </div>
                    <div className="text-right">
                        <p className="text-3xl font-bold">{playerData.streak}</p>
                        <p className="text-xs flex items-center gap-1 justify-end" style={{color:'#E6BCBC'}}><span className="flame">🔥</span>连续打卡</p>
                    </div>
                </div>
                <div className="grid grid-cols-3 gap-3">
                    {[
                        { label: '已学单词', value: playerData.totalWordsLearned, icon: '📚' },
                        { label: '答题正确率', value: correctRate + '%', icon: '🎯' },
                        { label: '当前等级', value: 'Lv.' + level, icon: '⭐' },
                    ].map(s => (
                        <div key={s.label} className="bg-white/15 rounded-2xl p-3 text-center">
                            <div className="text-xl mb-1">{s.icon}</div>
                            <div className="font-bold text-lg">{s.value}</div>
                            <div className="text-xs" style={{color:'#E6BCBC'}}>{s.label}</div>
                        </div>
                    ))}
                </div>
            </div>

            {/* 徽章墙 */}
            <div className="bg-white rounded-3xl p-5 shadow-card">
                <h3 className="font-bold text-quest-dark text-base mb-4 flex items-center gap-2">🏅 成就徽章</h3>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {BADGES.map(badge => {
                        const unlocked = badges.includes(badge.id);
                        return (
                            <div key={badge.id} title={unlocked ? '已解锁！' : `解锁条件：${badge.desc}`}
                                className={`rounded-2xl p-3 text-center transition-all ${unlocked ? 'bg-quest-lavender shadow-sm' : 'bg-gray-50 badge-locked'}`}>
                                <div className={`text-3xl mb-1 ${unlocked ? '' : 'grayscale'}`}>{badge.emoji}</div>
                                <div className={`font-bold text-xs ${unlocked ? 'text-quest-purple' : 'text-gray-400'}`}>{badge.name}</div>
                                <div className="text-xs text-gray-400 mt-0.5">{badge.desc}</div>
                                {unlocked && <div className="mt-1 text-xs text-quest-teal font-medium">✓ 已解锁</div>}
                            </div>
                        );
                    })}
                </div>
            </div>

            {/* 自定义词库 */}
            <div className="bg-white rounded-3xl p-5 shadow-card">
                <div className="flex justify-between items-center mb-4">
                    <h3 className="font-bold text-quest-dark text-base flex items-center gap-2">✏️ 我的单词本</h3>
                    <div className="flex gap-2">
                        <button onClick={handleExport}
                            className="px-3 py-1.5 rounded-full text-xs font-medium text-white transition-all hover:scale-105"
                            style={{ background: 'linear-gradient(135deg, #8A6888, #745B72)' }}>
                            📤 导出
                        </button>
                        <label className="px-3 py-1.5 rounded-full text-xs font-medium text-white transition-all hover:scale-105 cursor-pointer"
                            style={{ background: 'linear-gradient(135deg, #AAABB9, #8A9BB5)' }}>
                            📥 导入
                            <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                        </label>
                        <button onClick={() => setAdding(v => !v)}
                            className="px-3 py-1.5 rounded-full text-xs font-medium text-white transition-all hover:scale-105"
                            style={{ background: 'linear-gradient(135deg, #5C7995, #D49DAA)' }}>
                            {adding ? '取消' : '+ 添加'}
                        </button>
                    </div>
                </div>

                {adding && (
                    <div className="bounce-in-sm bg-quest-lavender rounded-2xl p-4 mb-4">
                        <div className="grid grid-cols-2 gap-2 mb-3">
                            <input value={newWord.en} onChange={e => setNewWord(p => ({ ...p, en: e.target.value }))}
                                placeholder="英文 (apple)" className="col-span-2 px-3 py-2 rounded-xl border border-white text-sm bg-white outline-none focus:border-quest-orange" />
                            <input value={newWord.zh} onChange={e => setNewWord(p => ({ ...p, zh: e.target.value }))}
                                placeholder="中文 (苹果)" className="col-span-2 px-3 py-2 rounded-xl border border-white text-sm bg-white outline-none focus:border-quest-orange" />
                            <input value={newWord.emoji} onChange={e => setNewWord(p => ({ ...p, emoji: e.target.value }))}
                                placeholder="表情 (🍎)" className="px-3 py-2 rounded-xl border border-white text-sm bg-white outline-none focus:border-quest-orange" />
                            <select value={newWord.partOfSpeech} onChange={e => setNewWord(p => ({ ...p, partOfSpeech: e.target.value }))}
                                className="px-3 py-2 rounded-xl border border-white text-sm bg-white outline-none focus:border-quest-orange">
                                <option value="noun">名词</option>
                                <option value="verb">动词</option>
                                <option value="adjective">形容词</option>
                                <option value="adverb">副词</option>
                                <option value="preposition">介词</option>
                                <option value="conjunction">连词</option>
                                <option value="other">其他</option>
                            </select>
                            <input value={newWord.pronunciation} onChange={e => setNewWord(p => ({ ...p, pronunciation: e.target.value }))}
                                placeholder="音标 (æpl)" className="px-3 py-2 rounded-xl border border-white text-sm bg-white outline-none focus:border-quest-orange" />
                            <select value={newWord.category} onChange={e => setNewWord(p => ({ ...p, category: e.target.value }))}
                                className="px-3 py-2 rounded-xl border border-white text-sm bg-white outline-none focus:border-quest-orange">
                                <option value="general">通用</option>
                                <option value="food">食物</option>
                                <option value="animal">动物</option>
                                <option value="family">家庭</option>
                                <option value="school">学校</option>
                                <option value="sports">运动</option>
                                <option value="travel">旅行</option>
                            </select>
                            <input value={newWord.example} onChange={e => setNewWord(p => ({ ...p, example: e.target.value }))}
                                placeholder="例句 (I eat an apple every day.)" className="col-span-2 px-3 py-2 rounded-xl border border-white text-sm bg-white outline-none focus:border-quest-orange" />
                        </div>
                        <button onClick={handleAdd}
                            className="w-full py-2.5 rounded-xl text-white font-bold text-sm hover:opacity-90 transition-all"
                            style={{ background: 'linear-gradient(135deg, #745B72, #5C7995)' }}>
                            保存单词 (+5 XP)
                        </button>
                    </div>
                )}

                {customWords.length === 0 ? (
                    <p className="text-center text-quest-muted py-6 text-sm">还没有自定义单词，快去添加第一个吧！</p>
                ) : (
                    <div className="space-y-2">
                        {customWords.map((w, i) => (
                            <div key={w.en + i} className="bg-gray-50 rounded-2xl p-3 hover:bg-gray-100 transition-all">
                                <div className="flex items-start gap-3">
                                    <span className="text-2xl">{w.emoji}</span>
                                    <div className="flex-1">
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="font-bold text-quest-dark text-sm">{w.en}</span>
                                            <span className="text-xs text-quest-purple bg-quest-lavender px-1.5 py-0.5 rounded-full">{w.partOfSpeech}</span>
                                            {w.category && w.category !== 'general' && (
                                                <span className="text-xs text-quest-teal bg-mint/50 px-1.5 py-0.5 rounded-full">{w.category}</span>
                                            )}
                                        </div>
                                        <div className="text-quest-muted text-xs mb-1">{w.zh}</div>
                                        {w.pronunciation && w.pronunciation !== w.en && (
                                            <div className="text-xs text-quest-coral mb-1">/{w.pronunciation}/</div>
                                        )}
                                        {w.example && (
                                            <div className="text-xs text-quest-orange italic mb-1">"{w.example}"</div>
                                        )}
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <button onClick={() => speak(w.en)} className="text-quest-teal hover:scale-110 transition-all text-sm" title="朗读">🔊</button>
                                        <button onClick={() => onDeleteWord(i)} className="text-quest-coral hover:scale-110 transition-all text-lg leading-none" title="删除">×</button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        </div>
    );
};

const WEEK_LABELS = ['日','一','二','三','四','五','六'];

const LearningCalendar = ({ dailyLogs }) => {
    const today = new Date();
    const todayStr = getTodayStr();
    const [viewYear, setViewYear] = useState(today.getFullYear());
    const [viewMonth, setViewMonth] = useState(today.getMonth()); // 0-indexed
    const [selectedDay, setSelectedDay] = useState(null); // dateStr or null

    const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sun
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    const prevMonth = () => {
        if (viewMonth === 0) { setViewYear(y => y - 1); setViewMonth(11); }
        else setViewMonth(m => m - 1);
        setSelectedDay(null);
    };
    const nextMonth = () => {
        if (viewMonth === 11) { setViewYear(y => y + 1); setViewMonth(0); }
        else setViewMonth(m => m + 1);
        setSelectedDay(null);
    };

    const monthLabel = `${viewYear} 年 ${viewMonth + 1} 月`;

    // 本月统计
    const monthPrefix = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}`;
    const monthEntries = Object.entries(dailyLogs).filter(([d]) => d.startsWith(monthPrefix));
    const monthCheckedDays = monthEntries.filter(([, v]) => v.checked).length;
    const monthXP = monthEntries.reduce((sum, [, v]) => sum + (v.xp || 0), 0);
    const monthWords = monthEntries.reduce((sum, [, v]) => sum + (v.words || 0), 0);

    // 当前连续打卡（从今天往前）
    let streak = 0;
    for (let i = 0; i < 365; i++) {
        const d = new Date(today); d.setDate(d.getDate() - i);
        const ds = d.toISOString().split('T')[0];
        if (dailyLogs[ds]?.checked) streak++;
        else if (i > 0) break; // 今天未打卡允许继续，但昨天断了就停
    }

    const selectedLog = selectedDay ? (dailyLogs[selectedDay] || null) : null;

    return (
        <div className="slide-up space-y-4">
            {/* 本月统计条 */}
            <div className="rounded-3xl p-5 text-white" style={{ background: 'linear-gradient(135deg, #745B72, #8A6888)' }}>
                <div className="flex items-center justify-between mb-3">
                    <div>
                        <p className="text-xs" style={{color:'#E6BCBC'}}>本月学习概览</p>
                        <p className="font-bold text-base">{monthLabel}</p>
                    </div>
                    <div className="text-right">
                        <p className="text-2xl font-bold">{streak}</p>
                        <p className="text-xs flex items-center gap-1 justify-end" style={{color:'#E6BCBC'}}><span className="flame">🔥</span>连续打卡</p>
                    </div>
                </div>
                <div className="grid grid-cols-3 gap-3">
                    {[
                        { icon: '✅', val: monthCheckedDays + ' 天', label: '打卡天数' },
                        { icon: '⭐', val: '+' + monthXP + ' XP', label: '本月获得' },
                        { icon: '📚', val: monthWords + ' 词', label: '学习单词' },
                    ].map(s => (
                        <div key={s.label} className="bg-white/15 rounded-2xl p-3 text-center">
                            <div className="text-lg mb-0.5">{s.icon}</div>
                            <div className="font-bold text-sm">{s.val}</div>
                            <div className="text-xs" style={{color:'#E6BCBC'}}>{s.label}</div>
                        </div>
                    ))}
                </div>
            </div>

            {/* 日历主体 */}
            <div className="bg-white rounded-3xl p-4 shadow-card">
                {/* 月份导航 */}
                <div className="flex items-center justify-between mb-4">
                    <button onClick={prevMonth} className="w-8 h-8 rounded-full bg-quest-lavender text-quest-purple flex items-center justify-center font-bold text-base hover:bg-quest-orange hover:text-white transition-all">‹</button>
                    <span className="font-bold text-quest-dark text-base">{monthLabel}</span>
                    <button
                        onClick={nextMonth}
                        disabled={viewYear === today.getFullYear() && viewMonth === today.getMonth()}
                        className="w-8 h-8 rounded-full bg-quest-lavender text-quest-purple flex items-center justify-center font-bold text-base hover:bg-quest-orange hover:text-white transition-all disabled:opacity-30 disabled:cursor-default">›</button>
                </div>

                {/* 星期表头 */}
                <div className="grid grid-cols-7 mb-2">
                    {WEEK_LABELS.map((w, i) => (
                        <div key={w} className={`text-center text-xs font-bold pb-1 ${i === 0 ? 'text-quest-coral' : i === 6 ? 'text-quest-teal' : 'text-quest-muted'}`}>{w}</div>
                    ))}
                </div>

                {/* 日期格 */}
                <div className="grid grid-cols-7 gap-1">
                    {/* 填充前置空白 */}
                    {Array.from({ length: firstDay }).map((_, i) => <div key={'e' + i} />)}

                    {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(day => {
                        const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        const log = dailyLogs[dateStr];
                        const isToday = dateStr === todayStr;
                        const isFuture = dateStr > todayStr;
                        const isChecked = log?.checked;
                        const hasData = log && (log.xp > 0 || log.words > 0);
                        const isSelected = selectedDay === dateStr;
                        const isWeekend = new Date(dateStr).getDay() === 0 || new Date(dateStr).getDay() === 6;

                        return (
                            <div
                                key={day}
                                className={`cal-day
                                    ${isChecked ? 'checked' : hasData ? 'has-data' : ''}
                                    ${isToday ? 'today' : ''}
                                    ${isFuture ? 'future' : ''}
                                    ${isSelected ? 'ring-2 ring-quest-orange ring-offset-1' : ''}
                                `}
                                style={!isChecked && !hasData ? { background: '#F5EEEE' } : {}}
                                onClick={() => !isFuture && setSelectedDay(isSelected ? null : dateStr)}
                            >
                                <span className={`cal-day-num ${isWeekend && !isChecked ? (new Date(dateStr).getDay() === 0 ? 'text-quest-coral' : 'text-quest-teal') : isChecked ? 'text-white' : 'text-quest-dark'}`}>{day}</span>
                                {isChecked && <span className="cal-day-dot bg-white/70" />}
                                {!isChecked && hasData && <span className="cal-day-dot" style={{ background: '#5C7995' }} />}
                                {isChecked && log?.xp > 0 && <span className="cal-day-xp text-white/80">+{log.xp}</span>}
                            </div>
                        );
                    })}
                </div>

                {/* 图例 */}
                <div className="flex items-center gap-4 mt-4 pt-3 border-t border-gray-100 flex-wrap">
                    {[
                        { color: 'linear-gradient(135deg,#745B72,#5C7995)', label: '已打卡' },
                        { color: 'linear-gradient(135deg,#E6BCBC,#D49DAA)', label: '有记录', border: '1px solid #D49DAA' },
                        { color: '#F5EEEE', label: '未学习', border: '1px solid #E6BCBC' },
                    ].map(l => (
                        <div key={l.label} className="flex items-center gap-1.5">
                            <div className="w-4 h-4 rounded-md flex-shrink-0" style={{ background: l.color, border: l.border }} />
                            <span className="text-xs text-quest-muted">{l.label}</span>
                        </div>
                    ))}
                </div>
            </div>

            {/* 日期详情卡（点击某天后显示） */}
            {selectedDay && (
                <div className="day-detail-modal bg-white rounded-3xl p-5 shadow-card">
                    <div className="flex items-center justify-between mb-4">
                        <div>
                            <p className="text-xs text-quest-muted">{selectedDay}</p>
                            <p className="font-bold text-quest-dark text-base">
                                {selectedLog?.checked ? '✅ 已打卡' : '📋 学习记录'}
                            </p>
                        </div>
                        <button onClick={() => setSelectedDay(null)} className="text-quest-muted text-2xl leading-none hover:text-quest-coral">×</button>
                    </div>

                    {selectedLog ? (
                        <div className="grid grid-cols-2 gap-3">
                            {[
                                { icon: '⭐', val: '+' + (selectedLog.xp || 0) + ' XP', label: '获得经验' },
                                { icon: '📚', val: (selectedLog.words || 0) + ' 词', label: '学习单词' },
                                { icon: '🎯', val: (selectedLog.correct || 0) + ' / ' + (selectedLog.answers || 0), label: '答题正确' },
                                { icon: '⏱️', val: selectedLog.minutes ? selectedLog.minutes + ' 分钟' : '—', label: '学习时长' },
                            ].map(s => (
                                <div key={s.label} className="bg-quest-lavender rounded-2xl p-3 text-center">
                                    <div className="text-xl mb-1">{s.icon}</div>
                                    <div className="font-bold text-quest-dark text-sm">{s.val}</div>
                                    <div className="text-xs text-quest-muted">{s.label}</div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="text-center py-6 text-quest-muted">
                            <div className="text-4xl mb-2">😴</div>
                            <p className="text-sm">这天没有学习记录</p>
                            <p className="text-xs mt-1 text-quest-orange">今天去学习，明天看到进步！</p>
                        </div>
                    )}
                </div>
            )}
        </div>
    );
};
