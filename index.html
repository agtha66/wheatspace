<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WheatSpace - Minimalist Loading</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Website Content -->
    <div id="main-content">
        <header style="text-align: center;">
            <h1>WheatSpace</h1>
            <p>Welcome to the minimalist, high-end healing space.</p>
            <div class="start-hint">[ 再次点击屏幕，开始学习 ]</div>
        </header>
    </div>

    <!-- Learning Content -->
    <div id="learning-content">
        <h1 style="font-family: 'Cormorant Garamond', serif; font-size: 3rem; margin-bottom: 20px; font-weight: 600;">Focus & Learn</h1>
        <p style="color: #8C8C8A; letter-spacing: 2px;">在这里开启你的专注之旅...</p>
    </div>

    <!-- Loading Curtain Animation -->
    <div id="curtain-container">
        <canvas id="curtain-canvas"></canvas>
        <div id="instruction">
            <span class="icon">👆</span>
            拖动鼠标，掀开门帘
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
