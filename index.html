// AI 口语搭档 (AI Speaking Partner)
// =============================================
// 自动适配 API 地址：file:// 协议时指向本地后端，否则用相对路径
const API_BASE = window.WHEATSPACE_CONFIG?.apiBase || ((location.protocol === 'file:') ? 'http://localhost:8080/api' : '/api');

const AIPartnerTab = ({ updatePlayer, addXP, globalGrade }) => {
    const [messages, setMessages] = useState([
        { role: 'assistant', text: 'Hi! I am your 7x24 AI Speaking Partner. We can practice any topic you like without any judgment. How was your day?' }
    ]);
    const [recording, setRecording] = useState(false);
    const mediaRecorderRef = useRef(null);
    const audioChunksRef = useRef([]);

    const toggleRecord = () => {
        if (recording) {
            handleStopRecord();
        } else {
            handleStartRecord();
        }
    };

    const handleStartRecord = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mediaRecorder = new MediaRecorder(stream);
            mediaRecorderRef.current = mediaRecorder;
            audioChunksRef.current = [];

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    audioChunksRef.current.push(event.data);
                }
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunksRef.current);
                const formData = new FormData();
                try {
                    const audioContext = new AudioContext();
                    const decoded = await audioContext.decodeAudioData(await audioBlob.arrayBuffer());
                    const targetRate = 16000;
                    const source = decoded.getChannelData(0);
                    const outputLength = Math.floor(source.length * targetRate / decoded.sampleRate);
                    const pcm = new Int16Array(outputLength);
                    for (let i = 0; i < outputLength; i++) {
                        const sample = source[Math.min(source.length - 1, Math.floor(i * decoded.sampleRate / targetRate))];
                        pcm[i] = Math.max(-1, Math.min(1, sample)) * (sample < 0 ? 32768 : 32767);
                    }
                    const wav = new ArrayBuffer(44 + pcm.byteLength);
                    const view = new DataView(wav);
                    const write = (offset, value) => [...value].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
                    write(0, 'RIFF'); view.setUint32(4, 36 + pcm.byteLength, true); write(8, 'WAVE'); write(12, 'fmt ');
                    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
                    view.setUint32(24, targetRate, true); view.setUint32(28, targetRate * 2, true);
                    view.setUint16(32, 2, true); view.setUint16(34, 16, true); write(36, 'data'); view.setUint32(40, pcm.byteLength, true);
                    new Int16Array(wav, 44).set(pcm);
                    formData.append('audio', new Blob([wav], { type: 'audio/wav' }), 'audio.wav');
                    await audioContext.close();
                } catch (conversionError) {
                    console.error('Audio conversion failed:', conversionError);
                    alert('音频格式转换失败，请重试。');
                    setMessages(prev => prev.slice(0, -1));
                    return;
                }
                
                try {
                    setMessages(prev => [...prev, { role: 'assistant', text: '...' }]);
                    const res = await fetch(API_BASE + '/ai/stt', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    
                    setMessages(prev => prev.slice(0, -1));

                    if (data.success && data.text) {
                        handleUserMessage(data.text);
                    } else {
                        alert('语音识别失败：' + (data.error || '未知错误'));
                    }
                } catch (err) {
                    setMessages(prev => prev.slice(0, -1));
                    console.error('STT API Error:', err);
                    alert('网络或服务错误，无法连接语音识别服务。');
                }
            };

            mediaRecorder.start();
            setRecording(true);
        } catch (err) {
            console.error('麦克风权限错误:', err);
            alert('获取麦克风权限失败，请确保您已允许浏览器访问麦克风。');
            setRecording(false);
        }
    };

    const handleStopRecord = () => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
            mediaRecorderRef.current.stop();
            mediaRecorderRef.current.stream.getTracks().forEach(track => track.stop());
        }
        setRecording(false);
    };

    const handleUserMessage = async (text) => {
        const newMessages = [...messages, { role: 'user', text }];
        setMessages(newMessages);
        
        try {
            const res = await fetch(API_BASE + '/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    gradeLevel: globalGrade,
                    messages: newMessages.map(m => ({ role: m.role, content: m.text }))
                })
            });
            const data = await res.json();
            
            if (data.success && data.reply) {
                setMessages(prev => [...prev, { role: 'assistant', text: data.reply }]);
                speak(data.reply, 'en-US', 1.0); // 原速朗读 AI 回复
                if(addXP) addXP(5);
            } else {
                throw new Error(data.error || '请求失败');
            }
        } catch (error) {
            console.error(error);
            const errMsg = "Sorry, my network is a bit shaky. Could you say that again?";
            setMessages(prev => [...prev, { role: 'assistant', text: errMsg }]);
            speak(errMsg, 'en-US', 1.0);
        }
    };

    return (
        <div className="p-4 pb-24 slide-up max-w-2xl mx-auto h-screen flex flex-col pt-20">
            <div className="text-center mb-4">
                <h2 className="text-2xl font-bold" style={{color:'#3D2E3D'}}>AI 无压力陪练</h2>
                <p className="text-sm mt-1" style={{color:'#9B8FA0'}}>7×24小时随时随地开口，消除"怕错怕笑"心理屏障</p>
                <div className="flex justify-center gap-2 mt-3">
                    <span className="px-3 py-1 rounded-full text-xs font-bold" style={{background:'#D49DAA', color:'#fff'}}>真实交流场景</span>
                    <span className="px-3 py-1 rounded-full text-xs font-bold" style={{background:'#5C7995', color:'#fff'}}>正向反馈固化</span>
                </div>
            </div>

            <div className="flex-1 overflow-y-auto mb-4 rounded-3xl p-4 shadow-card flex flex-col gap-4" style={{background:'#fff', border:'1px solid #E6BCBC'}}>
                {messages.map((msg, idx) => (
                    <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        {msg.role === 'assistant' && <div className="text-2xl mr-2">🤖</div>}
                        <div className={`p-3 rounded-2xl max-w-[80%] ${msg.role === 'user' ? 'bg-[#5C7995] text-white rounded-br-sm' : 'bg-[#F5EEEE] text-[#3D2E3D] rounded-bl-sm'}`}>
                            {msg.text}
                        </div>
                        {msg.role === 'user' && <div className="text-2xl ml-2">👤</div>}
                    </div>
                ))}
            </div>

            <div className="text-center">
                <button 
                    onClick={toggleRecord}
                    className={`w-24 h-24 rounded-full flex items-center justify-center text-4xl shadow-xl transition-all mx-auto ${recording ? 'scale-110' : 'hover:scale-105'}`}
                    style={{background: recording ? '#D49DAA' : '#745B72', color:'#fff'}}
                >
                    {recording ? '🎙️' : '🎤'}
                </button>
                <p className="mt-3 text-sm font-bold" style={{color:'#745B72'}}>
                    {recording ? '正在聆听... (点击结束)' : '点击麦克风开始对话'}
                </p>
            </div>
        </div>
    );
};

// =============================================
// 根组件 App
// =============================================
const App = () => {
    const [activeTab, setActiveTab] = useState('garden');
    const [globalGrade, setGlobalGrade] = useState('primary1');
    const [playerData, setPlayerData] = useState({
        xp: 0, level: 1, streak: 0, lastCheckIn: '',
        totalWordsLearned: 0, correctAnswers: 0, totalAnswers: 0,
        flipGamesCompleted: 0, perfectQuizzes: 0, goodPronunciations: 0,
    });
    const [badges, setBadges] = useState([]);
    const [customWords, setCustomWords] = useState([]);
    const [learnedWords, setLearnedWords] = useState(new Set());
    const [isLoading, setIsLoading] = useState(true);
    const [celebrate, setCelebrate] = useState(false);
    const [accentPreference, setAccentPreference] = useState('us');
    const [user, setUser] = useState(null); // { id, email, username }
    const [showLogin, setShowLogin] = useState(false);
    // dailyLogs: { [dateStr]: { checked, xp, words, correct, answers, minutes } }
    const [dailyLogs, setDailyLogs] = useState({});
    const [wordProgress, setWordProgress] = useState({}); // Ebbinghaus progress
    const [wordDetailPage, setWordDetailPage] = useState(null); // 当前查看的单词详情
    const [petEvent, setPetEvent] = useState(null); // 触发宠物动画的事件
    const [showBreakGame, setShowBreakGame] = useState(false); // 显示休息游戏
    const sessionStartRef = useRef(Date.now());

    // ---- 认证状态监听 ----
    useEffect(() => {
        window.WheatSpaceAuth.checkSession().then((session) => {
            if (session?.user) {
                const u = session.user;
                const displayName = u.nickname || u.phone || 'User';
                setUser({ id: u.id, phone: u.phone, username: displayName });
            }
        });
        const unsubscribe = window.WheatSpaceAuth.onAuthStateChange(async (_event, session) => {
            if (session?.user) {
                const u = session.user;
                const displayName = u.nickname || u.phone || 'User';
                setUser({ id: u.id, phone: u.phone, username: displayName });
            } else {
                setUser(null);
            }
        });
        return () => {
            if (unsubscribe) unsubscribe();
        };
    }, []);

    // ---- 初始化：从 localStorage 读取本地数据 ----
    useEffect(() => {
        const savedGrade = localStorage.getItem('eq_global_grade');
        if (savedGrade) setGlobalGrade(savedGrade);

        const timer = setTimeout(() => {
            try { const pd = localStorage.getItem('eq_player'); if (pd) setPlayerData(JSON.parse(pd) || { level: 1, xp: 0, coins: 0 }); } catch(e) {}
            try { const bd = localStorage.getItem('eq_badges'); if (bd) setBadges(JSON.parse(bd) || []); } catch(e) {}
            try { const cw = localStorage.getItem('eq_custom_words'); if (cw) setCustomWords(JSON.parse(cw) || []); } catch(e) {}
            try { const ac = localStorage.getItem('eq_accent'); if (ac) setAccentPreference(ac); } catch(e) {}
            try { const dl = localStorage.getItem('eq_daily_logs'); if (dl) setDailyLogs(JSON.parse(dl) || {}); } catch(e) {}
            try { const wp = localStorage.getItem('eq_word_progress'); if (wp) setWordProgress(JSON.parse(wp) || {}); } catch(e) {}

            // 打卡逻辑
            const today = getTodayStr();
            setPlayerData(prev => {
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                let streak = prev.streak;
                if (prev.lastCheckIn === yesterday) streak += 1;
                else if (prev.lastCheckIn !== today) streak = 1;
                const updated = { ...prev, lastCheckIn: today, streak };
                localStorage.setItem('eq_player', JSON.stringify(updated));
                return updated;
            });

            // 写入今日打卡标记
            setDailyLogs(prev => {
                const next = { ...prev };
                if (!next[today]) next[today] = { checked: true, xp: 0, words: 0, correct: 0, answers: 0, minutes: 0 };
                else next[today] = { ...next[today], checked: true };
                localStorage.setItem('eq_daily_logs', JSON.stringify(next));
                return next;
            });

            setIsLoading(false);
        }, 1000);
        return () => clearTimeout(timer);
    }, []);

    // ---- 持久化本地数据 ----
    useEffect(() => { if (!isLoading) localStorage.setItem('eq_global_grade', globalGrade); }, [globalGrade, isLoading]);
    useEffect(() => { if (!isLoading) localStorage.setItem('eq_badges', JSON.stringify(badges)); }, [badges, isLoading]);
    useEffect(() => { if (!isLoading) localStorage.setItem('eq_custom_words', JSON.stringify(customWords)); }, [customWords, isLoading]);
    useEffect(() => { if (!isLoading) localStorage.setItem('eq_accent', accentPreference); }, [accentPreference, isLoading]);
    useEffect(() => { if (!isLoading) localStorage.setItem('eq_daily_logs', JSON.stringify(dailyLogs)); }, [dailyLogs, isLoading]);
    useEffect(() => { if (!isLoading) localStorage.setItem('eq_word_progress', JSON.stringify(wordProgress)); }, [wordProgress, isLoading]);

    // ---- 更新每日日志的辅助函数 ----
    const updateTodayLog = useCallback((patchFn) => {
        const today = getTodayStr();
        setDailyLogs(prev => {
            const existing = prev[today] || { checked: true, xp: 0, words: 0, correct: 0, answers: 0, minutes: 0 };
            const next = { ...prev, [today]: patchFn(existing) };
            localStorage.setItem('eq_daily_logs', JSON.stringify(next));
            return next;
        });
    }, []);

    // ---- 会话埋点：记录用户会话 ----
    useEffect(() => {
        if (!user) return;
        sessionStartRef.current = Date.now();
        // 记录会话开始
        window.WheatSpaceAuth.recordLearningAction('session_start', {}, 0);
        const handleUnload = () => {
            const duration = Math.round((Date.now() - sessionStartRef.current) / 1000);
            trackEvent(user.id, 'session_end', { duration_seconds: duration }, duration);
        };
        window.addEventListener('beforeunload', handleUnload);
        return () => window.removeEventListener('beforeunload', handleUnload);
    }, [user?.id]);

    // ---- 登录成功回调 ----
    const handleLoginSuccess = useCallback((userInfo) => {
        setUser(userInfo);
        trackEvent(userInfo.id, 'login', { email: userInfo.email });
    }, []);

    // ---- 登出 ----
    const handleLogout = useCallback(async () => {
        await WheatSpaceAuth.logout();
        setUser(null);
    }, []);

    // ---- 徽章检查 ----
    const checkBadges = useCallback((pd, cw) => {
        const newBadges = BADGES.filter(b => !badges.includes(b.id) && b.condition(pd, cw)).map(b => b.id);
        if (newBadges.length > 0) setBadges(prev => [...prev, ...newBadges]);
    }, [badges]);

    const updatePlayer = useCallback((updater) => {
        setPlayerData(prev => {
            const next = updater(prev);
            localStorage.setItem('eq_player', JSON.stringify(next));
            return next;
        });
    }, []);

    const addXP = useCallback((amount) => {
        updatePlayer(prev => {
            const oldLevel = calcLevel(prev.xp).level;
            const next = { ...prev, xp: prev.xp + amount };
            if (calcLevel(next.xp).level > oldLevel) setCelebrate(true);
            return next;
        });
        updateTodayLog(log => ({ ...log, xp: (log.xp || 0) + amount }));
        // 触发宠物动画
        setPetEvent({ type: 'learn', ts: Date.now() });
    }, [updatePlayer, updateTodayLog]);

    const onLearnWord = useCallback((en) => {
        // Ebbinghaus Spaced Repetition Logic
        setWordProgress(prev => {
            const current = prev[en] || { step: 0 };
            const intervals = [1, 2, 4, 7, 15, 30]; // 艾宾浩斯复习间隔(天)
            const days = intervals[Math.min(current.step, intervals.length - 1)];
            const nextReview = Date.now() + days * 86400000;
            return { ...prev, [en]: { step: current.step + 1, nextReview, lastReview: Date.now() } };
        });

        if (learnedWords.has(en)) return;
        setLearnedWords(prev => { const s = new Set(prev); s.add(en); return s; });
        updatePlayer(prev => {
            const next = { ...prev, totalWordsLearned: prev.totalWordsLearned + 1 };
            checkBadges(next, customWords);
            return next;
        });
        addXP(2);
        updateTodayLog(log => ({ ...log, words: (log.words || 0) + 1 }));
        if (user) trackEvent(user.id, 'learn_word', { word: en });
    }, [learnedWords, addXP, updatePlayer, checkBadges, customWords, user, updateTodayLog]);

    const onPerfect = useCallback(() => {
        updatePlayer(prev => ({ ...prev, perfectQuizzes: prev.perfectQuizzes + 1 }));
        checkBadges(playerData, customWords);
        if (user) trackEvent(user.id, 'quiz_perfect', {});
    }, [updatePlayer, playerData, customWords, checkBadges, user]);

    const addCustomWord = useCallback((word) => {
        setCustomWords(prev => {
            const next = [...prev, word];
            setTimeout(() => checkBadges(playerData, next), 0);
            return next;
        });
        updatePlayer(prev => ({ ...prev, totalWordsLearned: prev.totalWordsLearned + 1 }));
        if (user) trackEvent(user.id, 'add_custom_word', { word: word.en });
    }, [checkBadges, playerData, updatePlayer, user]);

    const deleteCustomWord = useCallback((idx) => {
        setCustomWords(prev => prev.filter((_, i) => i !== idx));
    }, []);

    const allWords = useMemo(() => [
        ...WORD_BANKS.primary1, ...WORD_BANKS.primary2, ...WORD_BANKS.junior, ...customWords
    ], [customWords]);
    // 课程标准词库全量词（用于挑战模式兜底）
    const [curriculumAllWords, setCurriculumAllWords] = React.useState([]);
    React.useEffect(() => {
        fetch('./vocabulary.json').then(r => r.ok ? r.json() : Promise.reject()).then(data => {
            setCurriculumAllWords(data.map(w => ({ en: w.word, zh: w.zh, emoji: w.emoji || '📖', sentence: w.sentence, tip: w.tip || '' })));
        }).catch(() => {});
    }, []);
    const challengeWords = useMemo(() => curriculumAllWords.length >= 5 ? curriculumAllWords : allWords, [curriculumAllWords, allWords]);

    if (isLoading) return (
        <div className="flex flex-col items-center justify-center min-h-screen" style={{ background: 'linear-gradient(160deg, #FAF3F3, #F0E8F0, #EAE8F0)' }}>
            <div className="mb-4" style={{ animation: 'spin360 1.5s linear infinite', display: 'inline-block' }}>
                <svg width="64" height="64" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M80 300 Q80 120 256 80 Q432 120 432 300 Z" fill="#745B72"/>
                    <ellipse cx="256" cy="298" rx="176" ry="28" fill="#5C7995"/>
                    <rect x="232" y="240" width="48" height="62" rx="24" fill="#FAF3F3"/>
                    <path d="M200 148 Q170 80 230 40" stroke="#D49DAA" strokeWidth="9" fill="none" strokeLinecap="round"/>
                    <ellipse cx="230" cy="40" rx="10" ry="16" transform="rotate(-20 230 40)" fill="#5C7995"/>
                    <ellipse cx="252" cy="52" rx="10" ry="16" transform="rotate(5 252 52)" fill="#5C7995"/>
                    <ellipse cx="268" cy="74" rx="9" ry="15" transform="rotate(20 268 74)" fill="#5C7995"/>
                    <ellipse cx="276" cy="100" rx="8" ry="14" transform="rotate(35 276 100)" fill="#AAABB9"/>
                </svg>
            </div>
            <h2 className="text-xl font-bold mt-2" style={{color:'#745B72'}}>WheatSpace</h2>
            <p className="mt-1" style={{color:'#9B8FA0'}}>正在加载英语闯关乐园...</p>
        </div>
    );

    const tabContent = {
        garden: <WordGarden playerData={playerData} addXP={addXP} onLearnWord={onLearnWord} customWords={customWords} dailyLogs={dailyLogs} onOpenWordDetail={setWordDetailPage} updatePlayer={updatePlayer} updateTodayLog={updateTodayLog} wordProgress={wordProgress} globalGrade={globalGrade} setGlobalGrade={setGlobalGrade} />,
        sentence: <SentenceQuest globalGrade={globalGrade} />,
        aipartner: <AIPartnerTab updatePlayer={updatePlayer} addXP={addXP} globalGrade={globalGrade} />,
        challenge: <ChallengeMode allWords={challengeWords} addXP={addXP} onPerfect={onPerfect} />,
        calendar: <LearningCalendar dailyLogs={dailyLogs} />,
        achievement: <AchievementHub playerData={playerData} badges={badges} customWords={customWords} onAddWord={addCustomWord} onDeleteWord={deleteCustomWord} addXP={addXP} />,
    };

    return (
        <div className="min-h-screen" style={{ background: 'linear-gradient(160deg, #FAF3F3 0%, #F0E8F0 45%, #EAE8F0 100%)' }}>
            {celebrate && <CelebrationEffect onDone={() => setCelebrate(false)} />}
            {/* 单词详情页（全屏覆盖）*/}
            {wordDetailPage && (
                <WordDetailPage
                    word={wordDetailPage}
                    onBack={() => setWordDetailPage(null)}
                    onLearn={onLearnWord}
                />
            )}
            <Header
                playerData={playerData}
                user={user}
                onLogout={handleLogout}
                accentPreference={accentPreference}
                onAccentChange={setAccentPreference}
                onOpenSettings={() => setShowLogin(true)}
            />
            <LoginModal
                visible={showLogin}
                onClose={() => setShowLogin(false)}
                onLoginSuccess={handleLoginSuccess}
            />
            <main className="main-content max-w-3xl mx-auto px-4 pt-20 pb-24 sm:pt-20">
                <div className="mb-5">
                    {(() => {
                        const tab = TAB_LIST.find(t => t.id === activeTab);
                        return (
                            <div key={activeTab} className="bounce-in-sm flex items-center gap-2">
                                <span className="text-2xl">{tab.emoji}</span>
                                <h2 className="text-xl font-bold text-quest-dark">{tab.label}</h2>
                            </div>
                        );
                    })()}
                </div>
                {tabContent[activeTab]}
            </main>
            <TabNav activeTab={activeTab} setActiveTab={setActiveTab} />

            {/* 虚拟宠物 */}
            <VirtualPet event={petEvent} />

            {/* 番茄时钟 */}
            <PomodoroTimer
                sessionActive={!isLoading && !showBreakGame}
                onBreakTime={() => setShowBreakGame(true)}
            />

            {/* 休息游戏 */}
            {showBreakGame && (
                <BreakGame
                    onClose={() => setShowBreakGame(false)}
                    onComplete={() => {
                        setShowBreakGame(false);
                        setPetEvent({ type: 'perfect', ts: Date.now() });
                    }}
                />
            )}
        </div>
    );
};

class ErrorBoundary extends React.Component {
    constructor(props) { super(props); this.state = { hasError: false, error: null }; }
    static getDerivedStateFromError(error) { return { hasError: true, error }; }
    componentDidCatch(error, info) { console.error("ErrorBoundary caught an error", error, info); }
    render() {
        if (this.state.hasError) {
            return <div style={{padding: 20, color: 'red'}}><h1>Something went wrong.</h1><pre>{this.state.error.toString()}</pre></div>;
        }
        return this.props.children;
    }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
